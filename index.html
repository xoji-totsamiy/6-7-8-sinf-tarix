var D=[
["G6-sinf"],
[2],
["Qadimgi Misr","mil. avv. 3000-yil","Mena","Yuqori Misr hukmdori, birinchi fir’avn",["Misrda ikkita davlat (Yuqori va Quyi Misr) o‘rtasida boshlangan urushda g‘alaba qozonadi.","3000-yilda Misrni yagona davlatga birlashtiradi."]],
["Qadimgi Misr","mil. avv. XXVI asr","Xufu (Xeops)","Misr fir’avni",["Memfis shahri yaqinida uch fir’avn – Xufu, Xafra va Menkaura uchun piramidalar bunyod etilgan; Xufu piramidasi (Xeops) va Sfinks haykali eng mashhur inshootlar.","2600-yil atrofida Xeops piramidasi qurilgan."]],
["Qadimgi Misr","mil. avv. XVI asr","Yaxmos","Yangi podsholik asoschisi fir’avn",["Giksoslarni bir qancha janglarda tor-mor etib, bosqinchilarni Misrdan haydab chiqaradi.","Itoatsiz hukmdorlarni bo‘ysundirib, yangi fir’avnlar sulolasi asoschisi bo‘ladi; shu fir’avn zamonidan Yangi podsholik davri boshlanadi."]],
["Qadimgi Misr","mil. avv. XV asr","Tutmos III","Misr fir’avni",["Tutmos II davrida boshlangan Falastin, Finikiya va Suriyani istilo qilish yurishlarini davom ettiradi.","Uning yurishlari natijasida Misr qudratli davlatga aylanadi."]],
["Qadimgi Misr","Yangi podsholik","Tutanxomon","Misr fir’avni",["Eng mashhur maqbara shu fir’avnga tegishli bo‘lgan; maqbaradan topilgan boy buyumlar hozir ham saqlanadi."]],
["Qadimgi Misr","525-yil, mil. avv.","Kambiz II","Fors shahanshohi (Misrni zabt etgan)",["Kir II ning o‘g‘li; otasining istilochilik siyosatini davom ettirdi.","525-yilda Misrni zabt etib, Fors davlati hududini nihoyatda kengaytirdi."]],
["Qadimgi Misr","1822-yil","Jak-Fransua Shampolyon","Fransuz olimi",["1822-yilda qadimiy Misr matnlarini o‘qishga muvaffaq bo‘lib, iyeroglif sirini ochgan.","Kashfiyotga Rozett shahri yaqinidagi qadimgi misr va yunon tillaridagi bir xil ma’noli bitikli tosh sababchi bo‘lgan."]],
["Mesopotamiya","Shumer","Gilgamish","Uruk shahri podshosi (rivoyat qahramoni)",["Mesopotamiya rivoyatlarining eng sevimli qahramoni.","Afsonaga ko‘ra, bobosi uni jarga tashlashga buyuradi, burgut qutqaradi; voyaga yetgach bobosidan hokimiyatni tortib oladi va Urukni boshqaradi."]],
[3],
["Mesopotamiya","mil. avv. III ming yillik","Sargon I","Akkad podshosi",["Akkadni va Shumer shaharlarini o‘z hokimiyati ostida birlashtiradi.","5400 nafar jangchidan iborat muntazam qo‘shin tuzadi; ko‘plab shahar va qo‘shni mamlakatlarni zabt etadi, o‘zini “to‘rt iqlim mamlakati podshosi” deb e’lon qiladi.","Savdoni rivojlantirish uchun barcha shaharlarga yagona uzunlik, maydon va og‘irlik o‘lchovini joriy etadi."]],
["Mesopotamiya","mil. avv. XVIII asr","Hammurapi","Bobil podshosi",["Butun Mesopotamiyani yagona davlatga birlashtirishga muvaffaq bo‘ladi; Bobil eng qudratli davlatga aylanadi.","Qonunlar tuzuvchi hukmdor sifatida nom qoldirgan; qonunlari badavlat va qashshoqlar uchun birdek bo‘lgan."]],
["Mesopotamiya","mil. avv. VII asr","Ashshurbanipal","Ossuriya podshosi",["Hukmronligi yillarida Nineviyada sopol taxtachalardan iborat yirik kutubxona jamlangan."]],
["Mesopotamiya","mil. avv. VII–VI asr","Navuxodonosor II","Yangi Bobil podshosi",["Hukmronligi davrida Yangi Bobil podsholigi o‘z ravnaqining cho‘qqisiga chiqadi.","Misrni Yangi Bobilga qo‘shib oladi, Iyerusalimni (Quddus) vayron qiladi. Bobilni mustahkam qal’aga aylantiradi.","Turarjoy binolari va mudofaa devorlarida pishgan g‘isht ishlatish to‘g‘risida farmon beradi."]],
["Mesopotamiya","mil. avv. VII asr","Kiaksar","Midiya podshosi",["Hukmronligi davrida Midiya qudratli davlatga aylanadi (keyinchalik Kir II uni bo‘ysundiradi)."]],
["Fors (Ahamoniylar)","mil. avv. VI asr","Kir II","Fors shahanshohi, Ahamoniylar davlati asoschisi",["Midiya podsholigini bo‘ysundirgach, ulkan lashkar tuzib, bosqinchilik yurishlarini davom ettiradi.","O‘rta Osiyo hududini bosib olishga harakat qilgan birinchi fors hukmdorlaridan.","Massagetlar bilan jangda halok bo‘ladi."]],
["Fors (Ahamoniylar)","mil. avv. VI asr","To‘maris","Massagetlar qabilalari malikasi",["Kir II ning O‘rta Osiyoga bosqinchilik yurishiga qarshi massagetlarga boshchilik qiladi.","Jang maydonida Kir II ning o‘zi halok bo‘ladi."]],
["Fors (Ahamoniylar)","mil. avv. VI–V asr","Doro I","Fors shohi (Ahamoniylar)",["Kir II va Kambiz II istilochilik siyosatini davom ettiradi; uning buyrug‘i bilan qoyaga o‘yib yozilgan bitiklarda zabt etilgan o‘lkalar qatorida O‘rta Osiyoning qadimgi davlatlari ham sanab o‘tiladi.","Kichik Osiyodagi yunon koloniyalari va Frakiyani bosib olishi yunon-fors urushlarini boshlab beradi; keyin Yunonistonga yurish qiladi.","Hukmronligining birinchi yilida Marg‘iyonada Frada qo‘zg‘olonini bostiradi (522-yil).","Persepolda Doro I va Kserksning yuz ustunli zali saroyi qoldiqlari saqlangan."]],
["Fors (Ahamoniylar)","mil. avv. V asr","Kserks","Fors shohi (Doro I vorisi)",["Doro I vorisi; hukmronligi davrida o‘rtaosiyoliklar yunon-fors urushlarida ishtirok etgan.","Salamin dengiz jangida mag‘lub bo‘lib, flot qoldiqlari bilan Yunonistonni tark etadi."]],
[4],
["Fors (Ahamoniylar)","mil. avv. IV asr","Doro III","Ahamoniylarning oxirgi shohi",["330-yilda Makedoniyalik Aleksandr uning qo‘shinlarini tor-mor etadi; Ahamoniylar davlati tugaydi."]],
["Fors (Ahamoniylar)","Avesto davri","Zardusht (Zaratushtra)","Zardushtiylik dini asoschisi",["“Zardushtiylik” so‘zi Zaratushtra (Zardusht) nomi bilan bog‘liq.","Afsonaga ko‘ra, daryo bo‘yida Ahuramazda vakilining siymosini ko‘radi, nur izidan yurib oliy iloh – Ahuramazda huzuriga yetib boradi.","Zardushtiylar olov, yer, suv va yulduzlarga sig‘ingan."]],
["Hindiston va Xitoy","mil. avv. VI asr","Siddhartha Gautama (Budda)","Buddaviylik dini asoschisi",["VI asrda yangi buddaviylik dinining yaratilishi Budda taxtini olgan shahzoda Siddhartha Gautama nomi bilan bog‘liq.","Rivoyatga ko‘ra, 20 yoshgacha hukmdor otasi saroyida betashvish yashagan; “Ma’rifatga erishgan” deb ataladi."]],
["Hindiston va Xitoy","mil. avv. 246-yil","Sin Shixuandi","Xitoyni birlashtirgan hukmdor",["246-yilda Xitoyni o‘z hokimiyati ostida birlashtirgan hukmdor; Sin Shixuandi nomini olgan.","Ko‘chmanchi hunlardan himoya qilish uchun Shimoliy Xitoy bo‘ylab qurilgan mudofaa devorini mustahkamlashni buyurgan (Buyuk Xitoy devori).","Tirikligidayoq o‘ziga atab maqbara qurishga farmon bergan."]],
["Hindiston va Xitoy","mil. avv. II asr","U-Di (Xan imperatori)","Xitoy imperatori",["Xitoyning shimoliy qismini vayron qilgan hun qabilalariga qarshi ittifoqchilar topish uchun elchi Chjan Szyanni yuboradi.","Chjan Szyan yurgan yo‘l bo‘ylab Xitoyni Markaziy va G‘arbiy Osiyo bilan bog‘lovchi Buyuk ipak yo‘li o‘tadi."]],
["Hindiston va Xitoy","mil. avv. II asr","Chjan Szyan","Xitoy elchisi",["Imperator U-Di tomonidan hunlarga qarshi ittifoqchi qidirishga yuboriladi; Davan (Farg‘ona) haqida: 70 ta katta-kichik shahar, aholisi bir necha yuz ming deb yozgan.","Oloy vodiysidan o‘tib vataniga qaytadi; uning yo‘li Buyuk ipak yo‘li deb atalgan."]],
["O‘rta Osiyo","mil. avv. 329–328-yillar","Spitaman","Sug‘d qo‘zg‘olonchilari yo‘lboshchisi",["Maroqanda (Samarqand)ni qamal qiladi; yunonlarning katta kuchlari yaqinlashganini bilib qamalni qoldirib sahroga chekinadi.","328-yilda Makedoniyalik Aleksandr armiyasi bilan jangda yengiladi.","Qo‘zg‘olon bostirilsa-da, Sug‘diyonada yunon-makedonlar birinchi marta mag‘lubiyatga uchraydi."]],
["O‘rta Osiyo","mil. avv. 522-yil","Frada","Marg‘iyona qo‘zg‘olonchilari boshlig‘i",["Doro I hukmronligining birinchi yilida Marg‘iyonada fors istilochilariga qarshi yirik qo‘zg‘olon ko‘tariladi; Frada boshliq tayinlanadi.","Fradaning o‘zi asirga olinib qatl etiladi."]],
["O‘rta Osiyo","mil. avv. IV asr","Oksiart","Baqtriya podshosi (sug‘d zodagoni)",["Aleksandr bosqini davrida qurol ko‘tarishga qodir barchani jangga safarbar qiladi; Hisor tog‘larida qal’alar qurgan.","Qizi Ravshanak (Roksana) Aleksandrga turmushga chiqadi."]],
[5],
["O‘rta Osiyo","mil. avv. III asr","Diodot","Yunon-Baqtriya podsholigi asoschisi",["Bir qancha Baqtriya shaharlari hukmdori bo‘lib, o‘zini podsho deb e’lon qiladi."]],
["O‘rta Osiyo","mil. avv. III–II asr","Yevtidem","Yunon-Baqtriya podshosi",["Diodotdan keyin Yunon-Baqtriyada hokimiyat unga o‘tadi."]],
["O‘rta Osiyo","mil. avv. II asr","Demetriy","Yunon-Baqtriya podshosi",["Yevtidemning o‘g‘li; hukmronligi davrida Yunon-Baqtriya podsholigi eng katta sarhadlarga ega bo‘ladi."]],
["O‘rta Osiyo","milodiy I asr","Kudzula Kadfiz","Birinchi kushon hukmdori",["Yuechji qabilalarining mulklarini birlashtirgan."]],
["O‘rta Osiyo","milodiy I–II asr","Vima Kadfiz","Kushon podshosi",["Hukmronligi paytida davlat yanada kengayadi.","Hukmdor nomi bitilgan tanga zarb qilish boshlanadi; pul islohoti amalga oshiriladi."]],
["O‘rta Osiyo","milodiy II asr","Kanishka","Kushon podshosi",["Davrida Kushon podsholigi ulkan imperiyaga aylanib, o‘z taraqqiyotining cho‘qqisiga erishadi (Rim, Parfiya, Xitoy qatorida yirik imperiya)."]],
["O‘rta Osiyo","mil. avv. II asr","Mitridat I","Parfiya podshosi",["Parfiyada hokimiyat qo‘liga o‘tgach, Baqtriyaga harbiy tazyiqni kuchaytiradi."]],
["Makedoniya va Ellinizm","mil. avv. IV asr","Filipp II","Makedoniya podshosi",["Yunonistonni bosib olishni ko‘zlaydi; Afina shaharlari ittifoqi unga qarshi chiqadi.","Xeroniya jangida o‘g‘li Aleksandr qo‘mondonlik qilgan suvoriy qo‘shinlar qaqshatqich zarba beradi."]],
["Makedoniya va Ellinizm","mil. avv. IV asr","Makedoniyalik Aleksandr","Makedoniya podshosi, sarkarda",["330-yilda Fors davlatining oxirgi shohi Doro III qo‘shinlarini tor-mor etadi.","329-yilda Maroqandni bosib oladi; 328-yilda Spitamanni mag‘lub qiladi; Oksiartning qizi Roksanaga uylanadi.","Bosib olingan shaharlarga yunonlarni joylashtirib, yunon madaniyati tarqalishiga imkon yaratadi (Aleksandriya Esxata)."]],
["Makedoniya va Ellinizm","mil. avv. 312-yil","Salavk","Salavkiylar davlati asoschisi",["Aleksandrning lashkarboshilaridan biri; 312-yilda Bobil hukmdori bo‘ladi.","Davlati tarkibiga Mesopotamiya, Eron, Parfiya, Baqtriya, Sug‘diyona va Marg‘iyona kirgan."]],
["Qadimgi Yunoniston","mil. avv. 621-yil","Drakont","Afina hukmdori",["Adolatni xohlagan ikki tomon undan huquq va majburiyatlarda hammani tenglashtiruvchi qonunlar yozishni so‘raydi.","621-yilda xalq boshqaruvini bekor qilgan qonunlarni yozadi va amalga kiritadi."]],
["Qadimgi Yunoniston","mil. avv. 594-yil","Solon","Afina hukmdori, islohotchi",["Bilimdon va tajribali zodagon; xalqqa yon berishning tarafdori; zodagonlar uni Afina hukmdori etib saylaydi.","594-yilda davlatni idora qilishning oldingi tizimini o‘zgartiradi (Solon islohotlari)."]],
["Qadimgi Yunoniston","mil. avv. 443–429-yillar","Perikl","Afina strategi",["15 marta strateg lavozimiga saylanadi; Afina eng qudratli davlatga aylanib, demokratiya ravnaq topadi; bu davr “Perikl asri” deb ataladi.","Tarixchi Gerodot, haykaltarosh Fidiy unga do‘st bo‘lgan."]],
[6],
["Qadimgi Yunoniston","mil. avv. VIII asr","Gomer","Qadimgi yunon shoiri",["“Iliada” va “Odisseya” dostonlarini yozgan (“Iliada”ning bosh qahramoni Axilles)."]],
["Qadimgi Yunoniston","mil. avv. V asr","Fidiy","Yunon haykaltaroshi",["Akropoldagi ibodatxona – Parfenon qurilishiga boshchilik qilgan."]],
["Qadimgi Yunoniston","mil. avv. V asr","Gerodot","Yunon tarixchisi",["Turli mamlakatlarga sayohat qilib, yunon-fors urushlariga bag‘ishlab “Tarix” kitobini yozgan."]],
["Qadimgi Yunoniston","mil. avv. V asr","Sofokl","Yunon dramaturgi",["“Shoh Edip” va “Antigona” kabi eng mashhur tragediyalarni yozgan."]],
["Qadimgi Yunoniston","mil. avv. VI–V asr","Geraklit","Yunon faylasufi",["Yer yuzidagi hamma narsa olovdan kelib chiqqan deb aytgan."]],
["Qadimgi Yunoniston","mil. avv. V–IV asr","Demokrit","Frakiyalik faylasuf",["Geraklit fikriga e’tiroz bildirib, hamma narsa ko‘zga ko‘rinmaydigan mayda zarralar – atomlardan tashkil topgan degan g‘oyani bayon etgan."]],
["Qadimgi Yunoniston","mil. avv. IV asr","Diogen","Yunon faylasufi",["“Insonda hech qanday ehtiyojlar bo‘lmasligi shart” degan fikrni ta’limotiga asos qilgan; bochkada kun kechirgan."]],
["Qadimgi Yunoniston","mil. avv. IV asr","Demosfen","Afina notig‘i",["Elladada shaharlarni kezib, aholini makedonlarga qarshi birlashishga da’vat etgan."]],
["Qadimgi Yunoniston","mil. avv. III asr","Arximed","Yunon fizigi va matematigi (Sirakuza)",["Richag (dastak) qonunini ishlab chiqqan; “Evrika!” iborasi, “Menga tayanch nuqtasini topib bering, Yerni o‘z o‘qidan chiqarib yuboraman!” so‘zlari mashhur.","Rivoyatga ko‘ra, yorug‘likni ko‘zgu orqali jandab, Sirakuzaga hujum qilgan rimliklar kemalarini yondirgan."]],
["Qadimgi Rim","qirollik davri","Tarkviniy","Rimning so‘nggi etrusk hukmdori (laqabi)",["“Mag‘rur Tarkviniy” laqabli kishi mamlakatga saylab qo‘yilgan hukmdorni o‘ldirib hokimiyatni egallagan; keyin Rimda respublika o‘rnatilgan."]],
["Qadimgi Rim","mil. avv. 74–71-yillar","Spartak","Qullar qo‘zg‘oloni rahbari",["Frakiyalik qul; Kapuya gladiatorlik maktabiga sotib yuborilgan; qullarni qo‘zg‘olonga undaydi.","Qadimgi dunyodagi eng ommaviy va uyushgan qo‘zg‘olon; Mark Krass boshchiligidagi qo‘shin jo‘natiladi.","71-yil bahoridagi hal qiluvchi jangda lashkari tor-mor etilib, o‘zi halok bo‘ladi."]],
["Qadimgi Rim","mil. avv. I asr","Mark Krass","Rim sarkardasi",["Spartakka qarshi ko‘p ming kishilik qo‘shinga boshchilik qilgan.","Spartak qo‘zg‘oloni bostirilgach Pompey bilan hokimiyat uchun kurashgan; urushlardan birida halok bo‘lgan."]],
["Qadimgi Rim","mil. avv. I asr","Pompey","Rim sarkardasi",["Spartak qo‘zg‘oloni bostirilgach, Krass bilan uzoq vaqt hokimiyat uchun kurash olib borgan."]],
["Qadimgi Rim","mil. avv. I asr","Yuliy Sezar","Rim hukmdori",["Galliyadagi zafarli urushlari bilan mashhur; “Galliya urushi haqida xotiralar” muallifi.","Uning hukmronligi davrida ko‘pchilik boylikni qo‘lga kiritgan.","Yaqin do‘sti Brut boshchiligidagi fitna natijasida o‘ldirilgan."]],
[7],
["Qadimgi Rim","mil. avv. 44-yil","Brut","Sezarga qarshi fitna rahbari",["Fitnaga boshchilik qilib, keyin respublikani qayta tiklashga urinadi; Oktavian va Antoniy ittifoqi tomonidan tor-mor etiladi."]],
["Qadimgi Rim","mil. avv. I asr","Oktavian Avgust","Rim imperatori, Sezarning jiyani",["Mark Antoniy bilan ittifoq tuzib respublikachilarni tor-mor etadi.","Rim davlatining G‘arbiy qismini, Antoniy esa Sharqiy qismini boshqarishni o‘z qo‘liga oladi."]],
["Qadimgi Rim","mil. avv. I asr","Mark Antoniy","Rim sarkardasi",["Misrga kelib, malika Kleopatraga uylanadi va Rimning sharqiy viloyatlarini nikoh sovg‘asi sifatida unga beradi.","Jang qizigan pallada Kleopatra bilan Aleksandriyaga qochadi."]],
["Qadimgi Rim","mil. avv. I asr","Kleopatra","Misr malikasi",["Antoniyga turmushga chiqib, Rimning sharqiy viloyatlarini oladi; Oktavianga qarshi jangda Antoniy bilan Aleksandriyaga qochadi."]],
["Qadimgi Rim","milodiy 98-yildan","Trayan","Rim imperatori",["98-yilda imperator taxtini egallaydi; Dunay bo‘ylarida yashovchi daklar bilan urushlar olib boradi.","Balandligi 40 metr bo‘lgan Trayan ustunida daklar bilan urush manzaralari tasvirlangan."]],
["Qadimgi Rim","milodiy 330-yil","Konstantin","Rim imperatori",["Zamonida 330-yili Bosfor bo‘g‘ozidagi Vizantiy shahri imperiya poytaxti deb e’lon qilinadi; shahar uning sharafiga Konstantinopol deb atala boshlaydi."]],
["Qadimgi Rim","milodiy 410-yil","Alarix","Gotlar yo‘lboshchisi",["410-yilda gotlarga boshchilik qilib Rimni qurshab oladi."]],
["Qadimgi Rim","milodiy 452-yil","Attila","Hunlar yo‘lboshchisi",["Alarix vafotidan keyin Rimning undan dahshatliroq dushmani sifatida 452-yilda hun qabilalari bilan paydo bo‘ladi."]],
["Qadimgi Rim","milodiy 476-yil","Odoakr va Romul Avgustul","Rimdagi german qo‘shini sarkardasi va so‘nggi imperator",["476-yilda german qabilalarining Rimdagi yollangan qo‘shini sarkardasi Odoakr so‘nggi imperator Romulni taxtdan ag‘darib, imperator unvoni nishonini Konstantinopolga jo‘natadi.","G‘arbiy Rim imperiyasi tugaydi."]],
["Qadimgi Rim","milodiy I asr","Tit Liviy va Kvint Kursiy Ruf","Rim tarixchilari",["Tit Liviy “Rim tarixi”ni, Kvint Kursiy Ruf “Makedoniyalik Aleksandr tarixi” asarini yozgan."]],
["O‘rta Osiyo","mil. avv. I asr; milodiy II asr","Strabon va Arrian","Yunon tarixchilari",["Strabon “Geografiya” asarida ko‘plab mamlakatlar xalqlari haqida ma’lumot bergan.","Arrian Aleksandrning O‘rta Osiyoga harbiy yurishlari haqida “Aleksandrning harbiy yurishlari” asarini yozgan."]],
["G7-sinf"],
[8],
["Rim imperiyasi","395","Feodosiy va Arkadiy","Rim imperatori va uning katta o‘g‘li",["Feodosiyning o‘g‘illari 395-yili imperiyani ikkiga bo‘lib oladi: G‘arbiy Rim (poytaxti Rim) va Sharqiy Rim (poytaxti Konstantinopol).","Katta o‘g‘il Arkadiyga boy hududlar tegadi: Bolqon va Kichik Osiyo, Suriya, Falastin, Misr. Bu – Vizantiya."]],
["Franklar","410","Alarix","Vestgotlar sarkardasi",["410-yili “boqiy shahar” Rimni egallab, uch kun talaydi.","Aholi qarshiligi va oziq-ovqat tugashi sabab janubiy Galliyaga chekinadi.","Vestgotlar 418-yili janubi-g‘arbiy Galliyada ilk varvar qirolligini – Vestgot qirolligini tuzadi."]],
["Rim imperiyasi","476","Odoakr","G‘arbiy Rim sarkardasi",["476-yili isyon ko‘tarib, so‘nggi imperator Romul Avgustulni taxtdan ag‘daradi va monastirga yuboradi.","Imperatorlik nishonlarini Konstantinopolga yuborishni buyuradi.","Bu sana Yevropada feodal (yer egaligi) jamiyatiga o‘tish boshlanganini bildiradi."]],
["Rim imperiyasi","Italiya","Teodorix","Ostgotlar qiroli, poytaxti Ravenna",["Italiyada kuchli Ostgot qirolligini tuzadi.","Antik madaniyatni saqlash va Rimni qayta tiklashni maqsad qiladi.","Bosh vaziri – rimlik zodagon, faylasuf Boetsiy.","Din, urf-odat, til tafovutlari sabab ostgotlar va rimliklar kelisha olmaydi; VI asr o‘rtalarida qirollik quladi."]],
["Franklar","486–496","Xlodvig","Franklar qiroli, Meroving sulolasi asoschisi",["Sali franklari yo‘lboshchisi, Meroveyning nabirasi. 486-yili Suasson yaqinida Rim qo‘shinini yengadi, vestgotlarni bo‘ysundirib Janubiy Galliyani oladi.","Taxt da’vogarlarining barchasini yo‘q qiladi, xalq yig‘inlarini chaqirmay qo‘yadi. Boshqaruv markazi – sarov, harbiy kuchi – drujina, viloyatlarni graflar boshqaradi.","Rim-gall zodagonlarining yerlariga tegmaydi; bo‘sh yotgan yerlarni franklarga bo‘lib beradi.","Buyrug‘i bilan franklar odat-qonunlari lotin tilida “Sali haqiqati” nomi bilan yozilgan.","496-yili Rim cherkovi tartibida xristianlikni qabul qiladi: qirol hokimiyati va papa ittifoqi tuziladi, franklar va rim-gallar yagona xalqqa aylana boshlaydi.","Hududni o‘g‘illariga bo‘lib berishi keyinchalik davlat parchalanishiga sabab bo‘ladi."]],
["Franklar","732","Karl Martell","Franklar hukmdori",["Qirollikka xavf solgan nizolarga barham beradi.","732-yili Puate jangida (yetti kun) arab xalifaligi bosqinini to‘xtatadi; shu g‘alaba uchun “Martell” (Bolg‘a) laqabini oladi.","Benefitsiy islohoti: otliq jangchilarga harbiy xizmat sharti bilan yer beradi. Yer merosiy emas, xizmat qilmasa olib qo‘yilgan. Natijada feodallar toifasi va ritsarlik asoslari shakllanadi.","Cherkov yerlarini musodara qilish siyosatini yuritgan."]],
[10],
["Angliya","829","Ekbert","Ueseks hukmdori",["829-yili oroldagi barcha qirolliklarni yagona davlatga birlashtirib, o‘zini qirol deb e’lon qiladi; mamlakat “Angliya” deb atala boshlaydi.","838-yili normannlarning bir hujumini qaytaradi."]],
["Angliya","871–900","Buyuk Alfred","Angliya qiroli",["Normannlar hujumini qaytaradi: ko‘plab qal’alar qurib chegarani mustahkamlaydi, flot tuzadi, xalq lashkari o‘rniga tayyorgarlikdan o‘tgan jangchilar kiritadi.","Angliyada birinchi doimiy soliq – “daniyaliklar puli”ni joriy qiladi.","879-yili normannlarni ingliz yerlari daxlsizligini tan olishga majbur etadi.","Yepiskopliklar qoshida maktablar ochadi; “Anglosakson solnomasi” yuritiladi.","Qonunlarni to‘plab “Alfred haqiqati”ni chiqartiradi; lotin asarlarini anglosaks tiliga tarjima qildiradi."]],
["Angliya","1013","Kanut","Daniya qiroli, Angliya qiroli",["1013-yili ingliz sohiliga qo‘shin tushirib, Angliyani katta qiyinchiliksiz zabt etadi va qirol deb e’lon qilinadi.","Angliya, Shotlandiya, Norvegiya va Shvetsiyani o‘z ichiga olgan yirik davlat tuzadi; vafotidan so‘ng u parchalanadi."]],
["Angliya","XI asr","Eduard","Angliya qiroli",["Kanut davlati parchalangach ingliz taxtiga o‘tiradi va anglosakslar hukmronligini qayta tiklaydi."]],
["Angliya","1066","Vilgelm I Istilochi","Normandiya gersogi, Angliya qiroli",["1066-yili norman va fransuz ritsarlari bilan Angliya qirg‘oqlariga tushadi (Gastings jangi, anglosakslar tomonida Garold). Anglosakslarni ozod qilaman deb da’vo qilgan.","Ingliz cherkoviga ta’sirini kengaytirmoqchi bo‘lgan papa uni qo‘llab-quvvatlaydi; u o‘zini qirol deb e’lon qiladi.","Ko‘plab anglosakslar mulkini qo‘ldan boy beradi, hamma joyda yangi zodagonlarning tosh qal’alari quriladi.","Eng yaxshi yerlar va o‘rmonlarni qirol qo‘riqxonalari deb e’lon qiladi; eski fransuz tilida gapirgani uchun inglizlar qo‘zg‘olon ko‘taradi."]],
["Angliya","XII asr","Genrix I","Angliya qiroli, Vilgelm I ning kenja o‘g‘li",["Davrida qirollik sudi kuchayadi va qirollik moliya boshqarmasi tashkil topadi.","O‘g‘il farzandi bo‘lmagani uchun vafotidan so‘ng taxt uchun kurash avj oladi."]],
["Angliya","1154–1189","Genrix II","Angliya qiroli (qizining o‘g‘li)",["Taxt uchun uzoq kurashda g‘alaba qozonadi.","Moliyaviy va harbiy islohotlar: baronlar harbiy xizmat o‘rniga xazinaga “qalqon puli” to‘lashi mumkin.","Bu muntazam yollanma qo‘shin tuzish imkonini beradi; qirol hokimiyati kuchayadi."]],
["Muqaddas Rim","919","Genrix I","Saksoniya gersogi, Germaniya qiroli",["919-yili zodagonlar uni Sharqiy Frank hukmdori etib saylaydi – Germaniya qirolligining paydo bo‘lgan yili.","Vengerlar bilan 9 yilga sulh tuzadi.","Kuchli otliq qo‘shin tuzadi: har 9 xo‘jalikdan bir kishi jangchilikka tayyorlanish uchun burg (qal’a)larga ko‘chiriladi."]],
["Muqaddas Rim","955–962","Otton I","Germaniya qiroli, imperator",["955-yili Lex daryosi jangida vengerlarni yengadi; ular o‘troq bo‘lib, xristianlikni qabul qiladi.","962-yili Italiyaga yurib, papa Ioann XII tomonidan imperator deb e’lon qilinadi: Muqaddas Rim imperiyasi (962–1806).","E’tiborini Italiyaning janubiga qaratadi; imperiyani Rimning davomchisi hisoblaydi.","Davrida “Otton Uyg‘onish davri”: saroyda adabiy faoliyat, skriptoriyalar, lotin tili.","Ma’qul kelmagan papani yepiskoplar ishtirokida sud qilib, lavozimidan chetlatgan."]],
[11],
["Muqaddas Rim","X asr","Otton II","Imperator, Otton I ning o‘g‘li",["Vizantiya malikasiga uylanib, Vizantiya bilan madaniy aloqalarni mustahkamlaydi.","Davrida o‘g‘il va qiz bolalar maktablari paydo bo‘ladi."]],
["Muqaddas Rim","996","Otton III","Imperator, Otton I ning nabirasi",["Butun xristian dunyosini birlashtirish orzusida bo‘lib, Rimni doimiy poytaxt qilmoqchi bo‘lib, o‘ziga saroy qurdiradi.","Rimliklar saroyni qamal qiladi, u Ravennaga ko‘chadi. 996-yili Rimda toj kiygan.","Zamondoshlari uni “dunyo mo‘jizasi” deb atagan: tantanali marosimlar, toj, oltin shar, saltanat hassasi yaratilgan.","Ustozi rohib Gerbertni Silvester II nomi bilan papalikka saylatgan."]],
["Muqaddas Rim","1014–1024","Genrix II","Imperator, Saksoniyaliklarning oxirgisi",["Ehtiyotkor siyosat: Italiyadagi feodallar va shaharliklarning vassalligi bilan kifoyalanadi.","Germaniyada yashab, yon berishlar bilan gersoglarni itoatda tutadi; 1018-yili Rimda toj kiyadi.","Vafotidan so‘ng Italiyaning asosiy qismi nemis qirollari tasarrufidan chiqadi."]],
["Muqaddas Rim","XI asr","Konrad II","Imperator",["Uning davridagi imperiya chegaralari (XI asr) xaritada ko‘rsatilgan."]],
["Muqaddas Rim","1152–1190","Fridrix I Barbarossa","Imperator, Shtaufenlar sulolasi",["Imperiya siyosiy va harbiy qudratining cho‘qqisi; jasur, shafqatsiz sarkarda va iqtidorli siyosatchi.","Vengriya, Chexiya, Polsha, Daniya qirollariga ustunligini tan oldirishga intiladi; gersog va graflar urushlariga chek qo‘yadi.","Italiyaga besh marta yurish; 1155-yili Rimda toj kiyadi; 1158-yili shimoliy shaharlarni bo‘ysundiradi, qo‘zg‘olon ko‘targan Milanni vayron qiladi.","1176-yili Lenyano jangida mag‘lub bo‘lib, shimoliy shaharlar erkinligini tan oladi.","O‘g‘li Genrixni Sitsiliya malikasi Konstansiyaga uylantirib, janubiy Italiyani qo‘lga kiritadi; bu esa Germaniyada gersoglar o‘zboshimchaligini kuchaytiradi."]],
["Muqaddas Rim","1085","Genrix IV","German imperatori",["Papaga qarshi kurashdagi yordami uchun Chexiya knyaziga qirollik tojini in’om etadi."]],
["Vizantiya","395–1453","Vasilevslar","Vizantiya (Sharqiy Rim) imperatorlari",["“Vasilevs” – podsho. Amaldorlarni tayinlagan, qonun chiqargan, qo‘shinni boshqargan, urush va sulh e’lon qilgan.","Amaldorlar va qo‘shin bilan hisoblashishga majbur bo‘lgan; unvon merosiyligi kafolatlanmagan.","Imperiyaning ming yillik tarixida imperatorlarni taxtdan ag‘darish va qatl etish tez-tez uchragan.","Saroy dabdabali; to‘q qizil rangni faqat imperator kiya olgan."]],
["Vizantiya","527–565","Yustinian I","Vizantiya imperatori",["Vizantiya qudratining cho‘qqisi. Kambag‘al dehqon oilasidan; amakisi Yustin uni saroyga olib kelib o‘qitgan.","Atrofiga iqtidorli sarkardalar, huquqshunoslar, tarixchilarni to‘playdi.","Qurdirgan: Konstantinopoldagi Ayo Sofiya (532–537) va Ravennadagi San-Vitale.","Buyrug‘i bilan huquqshunoslar qadimgi Rim qonunlari majmuini yaratdi.","Orzusi – 395-yildan oldingi Rim chegaralarini tiklash: Shimoliy Afrika va Italiyaning katta qismini istilo qiladi. Qullikni tiklashga intilishi qo‘llab-quvvatlanmaydi.","Urushlar xazinani bo‘shatib, aholini xonavayron qiladi; o‘zi shafqatsiz va chaqimchilikka o‘ta ishonuvchan bo‘lgan."]],
["Vizantiya","VI asr","Yustin","Yustinianning amakisi, imperator",["Oddiy askarlikdan sarkardalikka ko‘tarilib, imperatorlik taxtini egallaydi.","Jiyani Yustinianni saroyga keltirib, yaxshi ta’lim olishini ta’minlaydi."]],
[12],
["Vizantiya","VII asr","Irakliy I","Vizantiya imperatori",["Eronga qarshi kurashib, Xusrav II qo‘shinini mag‘lub etadi.","Urush ikki tomonni ham zaiflashtirib, arablarning Misr, Suriya, Falastinni bosib olishiga yo‘l ochadi."]],
["Vizantiya","1096","Aleksey I","Vizantiya imperatori",["Konstantinopolda to‘planayotgan salibchilarga Yaqin Sharqda tuziladigan xristian davlatlari Vizantiyaga qaram bo‘lishi haqida vassallik qasamyodini qabul qildiradi, so‘ng ularni Bosfor orqali Kichik Osiyoga o‘tkazadi."]],
["Vizantiya","1202–1204","Isaak II Angel","Vizantiya imperatori",["Ukasi tomonidan taxtdan tushirilib, ko‘ziga mil tortilgan.","Unga toj-u taxtni qaytarish 4-salib yurishida Vizantiyaga urush boshlash uchun bahona bo‘ladi."]],
["Slavyan davlatlari","681","Asparux","Bulg‘or podshosi",["681-yili ilk slavyan davlati – Bulg‘or podsholigiga asos soladi (turkiy bulg‘orlar slavyanlarni bo‘ysundirgan, keyin ular aralashib ketgan)."]],
["Slavyan davlatlari","893–927","Simeon I","Bolgariya podshosi",["Bolgariya eng kuchaygan davr; qo‘shni Vizantiya bilan muvaffaqiyatli urushlar olib boradi.","XI asr boshida zaiflashgan Bolgariyani Vizantiya istilo qiladi; mustaqillik faqat XII asr oxirida tiklanadi."]],
["Slavyan davlatlari","966","Meshko I","Polsha knyazi",["966-yili xristianlikni nemis yepiskopladan qabul qiladi.","Polsha cherkovi 1000-yili arxiyepiskoplik rutbasini olib, nemis cherkovidan mustaqil bo‘ladi."]],
["Slavyan davlatlari","X–XI asr","Boleslav I Jasur","Polsha hukmdori, Meshko I ning vorisi",["Hukmronligi paytida Polsha qirollik tojiga erishadi."]],
["Slavyan davlatlari","IX asr","Ryurik","Rus knyazi, Ryuriklar xonadoni",["IX asr 2-yarmida sharqiy slavyan yetakchilari vikinglar xavfiga qarshi va o‘zaro raqobatni tugatish uchun Ryuriklar xonadonidan knyaz chaqiradi.","Novgorod, Beloozero, Izborskda knyazlik qiladi; keyin faqat Ryurik qoladi, vorislari Rusni asrlar boshqaradi."]],
["Slavyan davlatlari","882","Oleg","Ryurikning davomchisi",["882-yili Kiyevni egallab, Kiyev Rusi davlatiga asos soladi.","Dnepr havzasidagi slavyan qabilalarini bo‘ysundirishda davom etadi."]],
["Slavyan davlatlari","X asr","Igor va Svyatoslav","Rus knyazlari",["Harbiy drujinalari pecheneg va xazarlarga qarshi, janubda Vizantiyaga qarshi mudofaa janglari va bosqinchilik urushlari olib boradi."]],
["Slavyan davlatlari","988","Vladimir","Kiyev knyazi, Svyatoslavning vorisi",["Ichki va tashqi dushmanlarga qarshi kurashni davom ettiradi.","988-yili Vizantiya pravoslav cherkovi udumlari bo‘yicha xristianlikni qabul qilib, aholiga ham qabul qildiradi – nomi shu bilan Rus tarixida alohida o‘rin tutadi.","Elchilari Konstantinopoldagi Ayo Sofiyaga hayratga tushgan; bu qarorda hal qiluvchi bo‘lishi mumkin."]],
["Slavyan davlatlari","1019–1054","Yaroslav Donishmand","Kiyev Rusi knyazi",["Hokimiyat uchun kurashda g‘olib; bijanaklarni (pechenegilarni) uzil-kesil mag‘lub etadi.","Volga bo‘yida Yaroslavl shahriga asos soladi; davlat hududi kengayadi.","Kiyevda Avliyo Sofiya ibodatxonasini qurdiradi (keyin Polosk va Novgorodda ham); monastirlar huzurida maktablar ochiladi.","Novgorod va Kiyevda yilnomalar tuziladi; lotin va yunon asarlari rus tiliga tarjima qilinadi.","“Rus haqiqati” qonunlari tuziladi."]],
[13],
["Slavyan davlatlari","1113–1125","Vladimir Monomax","Kiyev Rusi knyazi",["Qipchoqlarga qarshi urush harakatlarini ularning yashash hududlariga ko‘chiradi.","Vafotidan so‘ng qarama-qarshiliklar qaytadan boshlanib, knyazlik siyosiy tarqoqlikka yuz tutadi."]],
["Arab xalifaligi","570–632","Muhammad (s.a.v.)","Islom payg‘ambari, arablarni birlashtirgan",["570-yili Makkada quraysh qabilasining hoshimiylar urug‘ida tug‘iladi; 610-yildan vahiy nozil bo‘ladi, 40 yoshida payg‘ambar bo‘lib, 23 yil da’vat qiladi.","Makka savdogarlari va quraysh zodagonlari qarshiligi tufayli 622-yili Yasribga hijrat qiladi; shahar Madina deb ataladi, hijriy yil boshi.","Madinada ilk masjid qurdiradi, ibodat tartibini joriy etadi; sudxo‘rlik, ichkilik, qimorni taqiqlaydi.","630-yili Makkani jangsiz egallab, Ka’badan but va sanamlarni chiqartiradi.","632-yili Madinada vafot etadi; VII asrda arablar yagona davlatga birlashadi."]],
["Arab xalifaligi","632–634","Abu Bakr","Birinchi xalifa",["Arabiston aholisi Islomni to‘liq qabul qiladi, qabilalar qo‘zg‘olonlari bostiriladi.","Arablar Iroq va Suriyani fath etadi.","Boshqaruvni takomillashtiradi: Maslahat kengashi tuziladi, har viloyatga voliy (hokim) tayinlanadi."]],
["Arab xalifaligi","634–644","Umar","Xalifa (“Umari odil”)",["Vizantiya mag‘lub etilib, Suriya, Falastin, Misr, Eronning katta qismi va Afrika sohillari zabt etiladi.","Soliq-o‘lpon tizimi ishlab chiqiladi; devon ro‘yxatidagi barcha xizmatchilarga maosh to‘lash joriy etiladi.","637-yili hijriy yil taqvimi joriy etiladi.","Taqvodor va adolatli bo‘lgani uchun “Umari odil” deyilgan; davri Islomning “oltin asri”."]],
["Arab xalifaligi","644–656","Usmon","Xalifa",["Eron Sosoniylari davlatini fath etish tugaydi; Amudaryo sohillariga chiqiladi; Tunis va Kavkazortida mavqe mustahkamlanadi.","Buyrug‘i bilan Qur’on matni to‘planib, bir kitob shakliga keltirilib o‘lkalarga tarqatiladi (bir nusxasi O‘zbekiston musulmonlari idorasida saqlanadi)."]],
["Arab xalifaligi","656–661","Ali ibn Abu Tolib","Xalifa, xulafoi roshidinlarning so‘ngisi",["Hukmronligini barcha tan olmaydi: tarafdorlari – shialar, raqiblari – xorijiylar.","Xorijiylar tomonidan o‘ldiriladi."]],
["Arab xalifaligi","661–750","Muoviya I va Umaviylar","Umaviylar sulolasi asoschisi",["Poytaxt – Damashq; xalifa lavozimi nasliy bo‘ladi; davlat xazinasi va arxivi tashkil etiladi; arab tili davlat tili deb e’lon qilinadi.","Jabal at-Tariq qo‘shini 711–714-yillari Vestgot qirolligini bo‘ysundiradi; 732-yili Puate jangida to‘xtatiladi.","Sharqda Tabariston, Jurjon, Movarounnahr, Hind sohili (Mo‘lton) egallanadi.","Xalq qo‘zg‘olonlari hokimiyatni zaiflashtirib, Abbosiylarga yo‘l ochadi."]],
["Arab xalifaligi","750–1258","Abbosiylar","Muhammad (s.a.v.) amakisi Abbos avlodlari",["VIII asr o‘rtalarida hokimiyatga keladi, qarorgohni Bag‘dodga ko‘chiradi.","Musulmon bo‘lmaganlar davlat xizmatiga olinmagan va ko‘proq soliq to‘laganlar, shuning uchun ko‘pchilik Islomni qabul qilgan.","756-yili Ispaniyada ilk mustaqil amirlik (Qurdoba) ajraladi; IX asrdan Misr, Eron, Movarounnahr, Xuroson mustaqil bo‘ladi.","1055-yili saljuqiylar Bag‘dodni egallaydi; 1258-yili Xuloku xalifalikni tugatadi."]],
[14],
["Arab xalifaligi","786–809","Horun ar-Rashid","Abbosiy xalifasi",["Abbosiylarning eng mashhur xalifasi; sivilizatsiya cho‘qqisi uning va vorisi Ma’mun davriga to‘g‘ri keladi.","Elchilari orqali Buyuk Karlga qimmatbaho tuhfalar va Quddusdagi Iso qabri joylashgan yerni ramziy taqdim etgan."]],
["Arab xalifaligi","813–833","Ma’mun","Abbosiy xalifasi",["Bag‘dodda “Bayt ul-hikma” (“Donishmandlik uyi”) – ilmiy muassasa va 400 ming jildlik kutubxona gullab-yashnaydi; uni Aflotun akademiyasiga qiyoslashadi.","Topshirig‘i bilan al-Farg‘oniy Damashq rasadxonasida yangi zij yaratish ishlariga rahbarlik qiladi."]],
["Arab xalifaligi","1031–1075","Al-Qoim","Abbosiy xalifasi",["1055-yili hokimiyatni To‘g‘rulbekka topshirib, uni sulton va “Sharq va G‘arb podshohi” deb olishga majbur bo‘ladi."]],
["Salib yurishlari","1169–1187","Salohiddin Ayyubiy","Ayyubiylar davlati asoschisi",["Amakisi Shirkuh bilan 1169-yili Nuriddin Zangiy yuborgan qo‘shin boshida Misrni egallaydi.","Shirkuh vafotidan so‘ng Misrda hokimiyatni to‘liq oladi, Ayyubiylar davlatini tuzadi.","1187-yili salibchilardan Quddusni tortib oladi; bu 3-salib yurishiga (1189–1192) sabab bo‘ladi."]],
["Saljuqiylar","XI asr","Saljuqbek","O‘g‘uzlar boshlig‘i, sulola nomi shundan",["Jand atrofiga ko‘chgan o‘g‘uzlar uning boshchiligida Islomni qabul qiladi.","Qoraxoniylar Movarounnahrni egallagach, Mahmud G‘aznaviy roziligi bilan 1025-yili Xurosonga ko‘chib o‘tadilar."]],
["Saljuqiylar","1038–1063","To‘g‘rulbek","Saljuqning nabirasi, davlat asoschisi",["1038-yili Saljuqiylar davlatiga asos soladi; ukasi Chag‘ribekni Xurosonda qoldirib, g‘arbga yuradi.","G‘arbiy Eron, Ozarbayjon va Iroqni bo‘ysundiradi.","1055-yili Bag‘dodda uning nomiga xutba o‘qiladi; xalifa uni sulton va “Sharq va G‘arb podshohi” deb e’lon qiladi.","Hudud Amudaryodan Frot daryosigacha cho‘ziladi."]],
["Saljuqiylar","1063–1072","Alp Arslon","Saljuqiy sulton",["Davlatni yanada kuchaytiradi; Kichik Osiyoga yurishlar uyushtiradi.","1071-yilgi Mansikert jangida saljuqiylar vizantiyaliklarni yengadi; Kichik Osiyoga o‘g‘uz turklari ko‘chib keladi."]],
["Saljuqiylar","1072–1092","Malikshoh","Saljuqiy sulton",["Saljuqiylarning eng yuksalgan davri.","Qoraxoniylarga zarba berib, 1074-yili Buxoro va Samarqandni egallaydi; Farg‘ona vodiysi va Sharqiy Turkistongacha yetadi.","Hudud Sharqiy Turkistondan O‘rta Yer va Marmar dengizigacha; salibchilar hujumini qaytarishda xizmati katta.","Vafotidan so‘ng taxt uchun kurash boshlanib, XII asr boshida davlat sharqiy va g‘arbiy qismlarga bo‘linadi."]],
["Saljuqiylar","XI asr","Nizomulmulk","Saljuqiylarning mashhur bosh vaziri",["“Rais ur-ruaso” – mamlakatning ichki va tashqi siyosatini nazorat qilgan, barcha devonlarga rahbarlik qilgan.","Davlat boshqaruvi asoslariga oid “Siyosatnoma” asarini yozgan."]],
["Saljuqiylar","XIII asr","Alouddin Kaykubod","Ko‘niya sultoni",["Davrida Ko‘niya sultonligi taraqqiyotining yuqori cho‘qqisiga chiqadi; Ko‘niya, Qaysari, Sivas hunarmandchilik va savdo markazlari bo‘ladi.","Keyingi sulton Kayxusrav II davrida (tangasi saqlangan) 1243-yili mo‘g‘ullar bosqini; 1308-yili sultonlik beyliklarga bo‘linadi, ulardan biri – Usmon beyligi."]],
[15],
["Saljuqiylar","XI asr","Mahmud G‘aznaviy","G‘azna hukmdori",["Saljuqiylarga 1025-yili Xurosonga ko‘chib o‘tishiga ruxsat beradi.","XI asr boshida Hindistonning shimoliga 17 marta harbiy yurish uyushtiradi."]],
["Mo‘g‘ullar","1155–1227","Chingizxon (Temuchin)","Mo‘g‘ullar ulug‘ xoni",["Qabilalar o‘zaro urushida g‘olib; 1206-yili Onon bo‘yidagi qurultoyda ulug‘ xon deb e’lon qilinadi, bosh shomon “Chingiz” (kuchli, qudratli) unvonini beradi. Poytaxt – Qoraqurum.","Qo‘shin: o‘nlik tizimi, yuzboshi-mingboshi-tumanboshi; maxsus gvardiya “keshik”; markaz va ikki qanotda yoyilib chekinish taktikasi.","Naymanlar, uyg‘ur, yoqut, qirg‘iz, buryatlarni bo‘ysundirib, 1211-yili Shimoliy Xitoyga urush boshlaydi.","1218-yili Yettisuv va Sharqiy Turkiston, 1219–1221-yillari Xorazmshohlar davlati, so‘ng Afg‘oniston, Sharqiy Eron, Kavkaz va Dashti Qipchoq (Kalka daryosida rus qo‘shini mag‘lub).","1224-yili yerlarni uluslarga bo‘lib, o‘g‘illari Jo‘ji, Chig‘atoy, O‘qtoy va Tuluga beradi; O‘qtoyni vorisi etib tayinlaydi."]],
["Mo‘g‘ullar","1237–1242","Botuxon","Chingizxonning nabirasi",["Sharqiy Yevropada istilo yurishlari: Rus knyazliklari, Polsha, qisman Serbiya va Bolgariya.","Bosib olingan hududlarda Oltin O‘rda davlatiga asos soladi."]],
["Mo‘g‘ullar","1256–1258","Xuloku","Tulining o‘g‘li",["1256-yili Eronni bosib olib, Xulokuiylar davlatiga asos soladi.","1258-yili Bag‘dodni egallab uch haftadan ortiq talaydi, kutubxonani yondiradi; Arab xalifaligi barham topadi.","Suriyani bosib, Halabni vayron qiladi; Misrga taslim bo‘lish shartini yuborib, rad etiladi."]],
["Mo‘g‘ullar","1260","Sayfiddin Qutuz","Misr sultoni, “Mo‘g‘ullar g‘olibi”",["Xorazmshohlar avlodidan, Jaloliddin Manguberdining jiyani; Damashq qul bozorida sotilib, mamluklar maktabida o‘qigan.","Misr taxtidagi 15 yoshli Al-Mansur Ali vasiysi sifatida boshqaruvni oladi, bosh sarkarda bo‘ladi.","1260-yili Ayn-Jalut jangida mo‘g‘ullarni tor-mor etib, ularning Yaqin Sharq va Afrikaga yurishini to‘xtatadi."]],
["Mo‘g‘ullar","1279","Xubilay","Mo‘g‘ul hukmdori",["1279-yili Xitoyni (Sun sulolasini) butunlay bosib oladi.","Venetsiyalik Marko Polo uning saroyida 17 yil xizmat qilgan."]],
["Sharq va Amerika","320–340","Chandragupta","Gupta sulolasi asoschisi (Hindiston)",["Kushon imperiyasi yemirilgach, Guptalar sulolasiga asos soladi.","Vorislari davrida yer egaligiga asoslangan feodal tuzum shakllanadi; IV–V asrlarda imperiya Arabiston dengizigacha yetadi.","VI asrda eftaliylar hujumi bilan imperiya parchalanadi."]],
["Sharq va Amerika","606–647","Xarsha","Kanuja rojasi, Xarsha imperiyasi asoschisi",["Imperiya Gang vodiysi bo‘ylab sharqiy Panjobdan Bengaliya qo‘ltig‘igacha; vassal rojalar qirqqa yaqin.","Shoir va dramaturg; saroyiga shoir va rassomlarni to‘playdi, Udjayinni madaniy markazga aylantiradi.","Har yili dunyo olimlarining anjumanini o‘tkazib, ularga sovg‘alar hadya qilgan.","Hinduiy ajdodlariga qaramay, buddaviylikni qabul qiladi va ibodatxonalar qurilishiga katta mablag‘ ajratadi.","Vafotidan so‘ng vassal rojalar ayirmachiligi imperiyani zaiflashtiradi."]],
[16],
["Sharq va Amerika","VII–XIII asr","Rojalar va rajputlar","Hindistondagi knyazliklar hukmdorlari",["Rojalar yaqinlari va jangchilariga xizmat evaziga yer in’om qilgan: “grass” (harbiy xizmat sharti bilan) va “patta” (xizmat muddatiga).","Rajputlar hukmdorlari shimoliy va markaziy Hindistonda 20 dan ortiq knyazlik tuzgan.","Ritsarlarga o‘xshash: jasurlik, sadoqat va or-nomus qoidalari bilan yashagan."]],
["Sharq va Amerika","589–1279","Xitoy imperatorlari","“Osmon o‘g‘li”: Suy, Tan, U Day, Sun",["Imperator “xudoning farzandi” deb sanalgan; so‘zi qonun bo‘lgan. Oddiy odamlar u bilan cho‘kib, ko‘zlarini pastga qaratib gaplashgan.","Har bir erkin dehqonga 80 mu ekin maydoni berilgan (sotish mumkin emas); evaziga soliq va ommaviy mehnat (Buyuk kanal, Buyuk devor ta’miri).","Amaldorlar Konfutsiy ta’limoti asosida davlat imtihonlari orqali tanlangan.","Vey podsholigi davrida chek yer tizimi shakllanadi.","1279-yili Xubilay Xitoyni butunlay bosib oladi."]],
["Sharq va Amerika","afsona","Tangun","Choson davlati afsonaviy asoschisi (Koreya)",["Samoviy shahzoda Xvanunning o‘g‘li; Pxenyanda Choson davlatiga asos soladi. Koreyslar Tangun davrini xalqning tashkil topish davri deb hisoblaydi."]],
["Sharq va Amerika","I–II asr","Jumong (Tonmyon)","Koguryo qirolligi asoschisi",["Koguryo I–II asrlarda qudratli davlatga aylanadi; IV asr boshida xitoyliklarni hududidan surib chiqaradi.","Qo‘shni qirolliklar va Xitoy sulolalariga qarshi tinimsiz kurashadi; 668-yili Tan sulolasi bosib oladi."]],
["Sharq va Amerika","918–1392","Van Gon","Koryo qirolligi asoschisi, lashkarboshi",["Uch qirollik parchalangach Koryo qirolligiga asos soladi; poytaxti – Sonak (Keson).","Koguryoning shimoliy-sharqiy Xitoydagi yo‘qotilgan yerlarini qaytarmoqchi bo‘ladi, amalga oshmaydi.","1231-yili mo‘g‘ullar Koryoni bosib oladi."]],
["Sharq va Amerika","IV–XIII asr","Yaponiya imperatorlari va syogunlar","Mikado va oliy harbiy hukmdorlar",["Imperator (mikado) quyosh ilohidan tarqalgan, iloh hisoblangan, lekin real hokimiyatga ega bo‘lmagan, uning nomidan eng nufuzli harbiy hukmdorlar.","XII asrdan oliy harbiy hukmdorlar syogun unvonini olgan. Minamoto-no Yoritomo – Kamakuraning birinchi syoguni (XII asr oxiri).","Samuraylar – knyazlar xizmatidagi jangchilar, busido qoidalariga amal qilgan. XIII asr oxirida mo‘g‘ullar bosqini muvaffaqiyatsiz."]],
["Sharq va Amerika","I ming yillik","Mayya hukmdori","Shahar-davlat boshlig‘i (“buyuk kishi”)",["Mayyalar shahar-davlatlarini “buyuk kishi” – hukmdor boshqargan; hokimiyat merosiy bo‘lgan."]],
["Sharq va Amerika","XII asr","Astek tlatoani","Asteklar oliy hukmdori",["Hukmron qabila vakillaridan saylangan lashkarboshi; oliy hukmdor va bosh kohin vazifasini birga bajargan.","Poytaxt – Tenochtitlan."]],
["Sharq va Amerika","XII–XIII asr","Oliy Inka","Inklar davlat hukmdori",["“Quyoshning o‘g‘li”, uning yerdagi ramzi sanalgan.","Boshqa qabilalar yerlarini bosib olib, And tog‘laridan Tinch okeanigacha o‘z hokimiyatini o‘rnatgan; poytaxt – Kusko."]],
["Papalik","800","Lev III","Rim papasi",["Rimdagi zodagonlar isyonidan so‘ng Buyuk Karl saroyiga boshpana izlab boradi va yordam so‘raydi.","Karl isyonni bostirgach, 800-yil dekabrida unga avliyo Pyotr ibodatxonasida imperatorlik tojini kiydiradi."]],
[17],
["Papalik","962","Ioann XII","Rim papasi",["962-yili Italiyaga kelgan Otton I ni imperator deb e’lon qiladi: Muqaddas Rim imperiyasi tashkil topadi."]],
["Papalik","X asr oxiri","Silvester II (Gerbert)","Rim papasi",["Kambag‘al oiladan chiqqan rohib Gerbert Qurdoba va Ishbiliyada tahsil olgan.","Imperator Otton III ning ustozi; uning yordamida papalikka saylangan."]],
["Papalik","1095","Urban II","Rim papasi",["1095-yili Klermonda cherkov yig‘inida nutq so‘zlab, Quddusdagi “payg‘ambar qabri”ni musulmonlardan ozod etishga chaqiradi.","Qatnashchilarga gunohlari kechirilishini va halok bo‘lganlar ruhi jannatga tushishini va’da qiladi; Falastinning boyligini eslatadi.","Xaloyiq “Xudoning irodasi shu!” deb qarsaklaydi, kiyimlariga xoch tikadi: salib yurishlari boshlanadi."]],
["Papalik","1198–1216","Innokentiy III","Rim papasi",["Davrida katolik cherkovi qudratining cho‘qqisiga chiqadi: “qirol hokimiyati o‘z jilosini papalikdan oladi”.","German, fransuz va ingliz hukmdorlarini interdikt orqali tavba qildiradi.","XII asr oxirida yangi salib yurishini tashkil etadi: to‘rtinchi salib yurishi (1202–1204)."]],
["Papalik","1227–1241","Grigoriy IX","Rim papasi",["Davrida yeretiklarga qarshi cherkov sudi – inkvizitsiya ayniqsa avj oladi."]],
["Salib yurishlari","1097","Bogemond I","Salibchilar qo‘mondoni",["1097-yil 20-oktyabr Antioxiya jangida salibchilarga qo‘mondonlik qilib, Mosul amiri Kerboga qo‘shiniga qarshi turadi."]],
["Salib yurishlari","XII asr","Imomiddin Zangiy","Saljuqiy Malikshohning ishonchli vakili",["Salibchilarga zarba berib, Mosul va Halab oralig‘idagi yerlarni egallaydi."]],
["Salib yurishlari","1146–1169","Nuriddin Zangiy","Imomiddinning o‘g‘li",["1146-yili otasi o‘rniga taxtga o‘tirib, darhol salibchilarga qarshi urush boshlaydi; ikkinchi salib yurishi (1147–1149) muvaffaqiyatsiz tugaydi.","Antioxiya knyazligining katta qismini egallaydi; Edessada hukmronligini saqlab qoladi.","1155-yili Damashqni olib, Suriyada musulmonlarni yagona hokimiyatga birlashtiradi.","1169-yili Shirkuh va Salohiddin boshchiligida Misrga qo‘shin yuborib, uni egallaydi."]],
["Salib yurishlari","1212","Fridrix II","Germaniya imperatori",["Bolalar salib yurishi (1212) paytida bolalarni qul qilib sotgan ikki qulfurushni qo‘lga olib, qatl ettiradi.","Misr sultoni bilan bitim tuzib, bolalarning bir qismini qaytarishga erishadi."]],
["Salib yurishlari","1269–1270","Lyudovik IX","Fransiya qiroli",["Sakkizinchi salib yurishi – so‘nggisi; Yaqin Sharqdagi vaziyatni o‘zgartira olmaydi.","Ko‘p o‘tmay salibchilarning mulklari birin-ketin musulmonlar qo‘liga qaytadi."]],
[18],
["Papalik","—","Boshqa shaxslar","Hukmdor bo‘lmagan, lekin testda uchraydi",["Boetsiy – Teodorix vaziri; Alkuin va Eyngard – Karl davri olimlari; Gerbert – Otton III ustozi.","Kirill va Mefodiy – 863-yili Moraviyada slavyan alifbosini yaratib, Injilni tarjima qilgan rohiblar.","Nizomulmulk – saljuqiy bosh vazir; Jabal at-Tariq – Vestgot qirolligini bo‘ysundirgan sarkarda; Shirkuh – Salohiddin amakisi.","Al-Xorazmiy (783–850), al-Farg‘oniy (797–865), Beruniy (973–1048), Ibn Sino (980–1037) – xalifalik davri allomalari.","Marko Polo – Xubilay saroyida 17 yil xizmat qilgan venetsiyalik savdogar."]],
["G8-sinf"],
[19],
["Fransiya","987","Gugo Kapet","Fransiya qiroli, Kapetinglar sulolasi",["Karolinglarning so‘nggi vakili Lyudovik V vafotidan so‘ng 987-yili hokimiyat tepasiga keladi.","Qirol hokimiyatining nufuzi past: Fransiya 14 ta mustaqil mulkka bo‘linib ketgan; Burgundiya, Normandiya, Akvitaniya feodallari qiroldan kuchli, ular qirolni “tenglarning birinchisi” deb hisoblagan."]],
["Fransiya","XII asr","Lyudovik VI","Fransiya qiroli",["Fransiyani birlashtirish jarayoni uning davrida boshlanadi.","Butun hukmronligini mahalliy feodallarga qarshi kurashda o‘tkazib, Burj va Sans shaharlarini qirol hokimiyatiga bo‘ysundiradi.","Birlashtirishdagi eng katta to‘siq – Angliyaning Fransiyadagi mulklari."]],
["Fransiya","XII asr","Lyudovik VII","Fransiya qiroli",["Otasi uni Akvitaniya malikasi Eleonoraga uylantirib, bu muhim hududni ma’lum muddat qirolga qaram qiladi."]],
["Fransiya","XII–XIII asr","Filipp II Avgust","Fransiya qiroli, Lyudovik VII ning o‘g‘li",["Birlashtirish siyosatini izchil olib boradi; hukmronligi monarxiyada burilish davri, daromad oshadi.","Inglizlarga qarshi urushlarda Normandiya, Men, Anju, Tyuren va Puatyening bir qismini qo‘shib oladi: Atlantika okeani va La-Manshga chiqish, Sena va Luara havzalari qirol qo‘liga o‘tadi.","Ma’muriy islohot: barcha qirol mulklari 20 viloyatga bo‘linadi: mahalliy hokimlar sud qilish, soliq yig‘ish, qo‘shin to‘plash va qirolga hisobot berish vakolatiga ega bo‘ladi."]],
["Fransiya","1285–1314","Filipp IV","Fransiya qiroli",["Shampan, Navarra, Lion qo‘shib olinib, mamlakatning 3/4 qismi birlashtiriladi; Flandriya, Bretan, Akvitaniya, Burgundiya hali mustaqil.","Flandriyani bosib olishga e’tibor qaratadi; papa Bonifatsiy VIII yurishni to‘xtatishni talab qiladi, munosabatlar buziladi.","Xazina bo‘shab qolgani uchun cherkovdan ham soliq talab qiladi; papa anafema e’lon qilmoqchi bo‘lganda, qirol vakili yollanma askarlar bilan papa huzuriga bostirib kiradi, Bonifatsiy VIII tez orada vafot etadi.","Fransiyalik arxiyepiskopni Kliment V nomi bilan papa qildiradi; u Avinyonga ko‘chadi: 1309–1377 “papalarning Avinyon tutqunligi”.","1302-yili Parijda uch toifa (ruhoniylar, dvoryanlar, mulkdor shaharliklar)dan General shtatlarni chaqiradi; keyin yangi soliq kerak bo‘lganda chaqirilib turiladi."]],
["Papalik","1294–1303","Bonifatsiy VIII","Rim papasi",["Filipp IV dan Flandriyaga yurishni to‘xtatishni talab qiladi.","Qirolning cherkovdan soliq talabiga javoban anafema e’lon qilishga kirishadi; qirol vakilining haqoratiga chidamay vafot etadi."]],
["Papalik","1309","Kliment V","Rim papasi, Filipp IV nomzodi",["Qirol fransiyalik arxiyepiskopni papa etib sayladirgan; Rimdagi noroziliklardan qo‘rqib Fransiya janubidagi Avinyonga ko‘chadi."]],
["Fransiya","1314","Filipp VI (Valua)","Fransiya qiroli",["Kapetinglar sulolasidan Filipp IV 1314-yili vafotidan so‘ng munosib nomzod topilmagani uchun Valualar xonadonidan Filipp VI taxtga o‘tiradi.","Ingliz qiroli Eduard III (Filipp IV ning qizidan nabirasi) da’vogarlik qiladi; fransuz huquqshunoslari “Sali haqiqati” bo‘yicha ayol tomonidan hisoblangan avlod taxtga da’vo qila olmaydi deydi – Yuz yillik urushga bahona."]],
["Angliya","1337–1347","Eduard III","Angliya qiroli",["Taxtga da’vo qilib, 1337-yili Fransiyaga hujum bilan Yuz yillik urushni (1337–1453) boshlaydi.","1340-yili fransuz flotini tor-mor etib, dengizda hukmron bo‘ladi.","1346-yili Kresi jangida g‘alaba qozonadi: fransuz ritsarlari tartibsiz, ingliz kamonchilari (yomenlar) intizomli – uzun kamon urush uslubini o‘zgartiradi.","1347-yili Kale portini egallaydi; u 1558-yilgacha inglizlarda qoladi."]],
["Fransiya","1356","Ioann Saxiy","Fransiya qiroli",["1356-yili Puatye jangida inglizlarga mag‘lub bo‘lib, o‘g‘li shahzoda Filipp bilan birga asir tushadi.","G‘alaba natijasida Fransiyaning g‘arbiy va shimoliy qismi inglizlar qo‘liga o‘tadi; asir qirol o‘rniga dofin Karl mamlakatni boshqaradi."]],
["Fransiya","1360","Karl V","Fransiya qiroli",["1360-yili inglizlar bilan og‘ir shartli sulh imzolaydi (shimol va g‘arbning ko‘p qismi Angliyaga o‘tadi), lekin bu o‘nglab olishga vaqt beradi.","O‘zboshimcha zodagonlarni bo‘ysundirib, puxta harbiy tayyorgarlikli qo‘shin va kuchli flot tuzadi.","1369-yilgi jangda Angliya mag‘lub bo‘ladi; vafotidan so‘ng ahvol yana og‘irlashib, urush qayta boshlanadi."]],
["Fransiya","1380–1422","Karl VI","Fransiya qiroli",["Yuz yillik urushning eng qizg‘in davri; 1415-yili Azenkur jangida qo‘shini mag‘lub bo‘lib, inglizlar shimolni egallaydi, Parijga kiradi.","1420-yili haqoratomuz Trua shartnomasi: Fransiya va Angliya birlashtirilib, ingliz shahzodasi qirol bo‘lishi belgilanadi.","1403-yili Amir Temurga javob maktubi yozadi: do‘stlik va savdogarlarga izzat-ikrom bildirgan."]],
["Fransiya","1422–1461","Karl VII","Fransiya qiroli",["Yosh dofin sifatida Janna d’Ark bilan uchrashib, unga ritsarlar bo‘linmasini beradi.","Orlean ozod bo‘lgach, Reyms shahrida tantanali toj kiyadi (1429).","Janna d’Ark asir tushganda uni qutqarishga harakat ham qilmaydi.","1436-yili Parijga kirib keladi; 1453-yili Bordoda inglizlar taslim bo‘ladi, Yuz yillik urush tugaydi."]],
[21],
["Fransiya","1429–1431","Janna d’Ark","Orlean qizi, xalq qahramoni",["Domremi qishlog‘ida dehqon oilasida tug‘ilgan; vatanini ozod qilishni niyat qilib, 16 yoshida qishlog‘ini tark etib, Lusrada Karl VII bilan uchrashadi.","Hunarmandlar unga qurol va sovut yasab beradi; erkakcha kiyinib jangga otlanadi.","1429-yili ikki yuz kun qamalda turgan Orleanni ozod qiladi – Yuz yillik urushda tub burilish.","1430-yili Kompen qal’asi janglarida burgundlarga asir tushadi, ular uni inglizlarga sotadi; cherkov sudi o‘limga hukm qiladi.","1431-yil 30-may Ruan shahrida gulxanda yoqiladi; 1456-yili sud qarori noqonuniy deb topilib, oqlanadi."]],
["Fransiya","1358","Gilyom Kal","Jakeriya qo‘zg‘oloni yo‘lboshchisi",["1358-yili Bove viloyatida boshlangan dehqonlar qo‘zg‘olonida 100 mingdan ortiq dehqon ishtirok etadi; bayroqlarida qirol gerbi – oq nilufar.","Sulh bahonasida aldab asir olinadi, boshiga qizdirilgan temir halqa kiydiriladi; 20 ming dehqon qirib tashlanadi."]],
["Fransiya","1461–1483","Lyudovik XI","Fransiya qiroli",["Mashhur siyosatdon va mohir diplomat: “Siyosat va uddaburonlikni bilmagan kishi qirol bo‘la olmaydi”.","1471–1475 Frank-Burgund urushlari: dastlab mag‘lub bo‘lib, so‘ng ayyorlik bilan gersog qo‘shinini o‘z tomoniga og‘dirib, Karl Jasur o‘ldirilishiga erishadi.","Karl Jasur yerlari va Marsel qirolga o‘tadi; Bretan faqat vorislari davrida qo‘shiladi – birlashtirish XV asr oxirida yakunlanadi.","Ritsar va yollanma askarlardan doimiy qo‘shin, ta’minot uchun yillik soliq joriy qiladi; General shtatlarni faqat bir marta chaqiradi: mutlaq monarxiya.","Italiyadan ipak ustalarini Lionga joylashtiradi; yagona pul, o‘lchov va og‘irlik birliklari, savdo floti."]],
["Fransiya","1471","Karl Jasur","Burgundiya gersogi",["Qirolga qarshi zodagonlar ittifoqi “Jamiyat baxt-saodati”ning rahbari.","“Fransiyani shu qadar yaxshi ko‘ramanki, bitta qirol o‘rniga oltita qirol bo‘lishini xohlayman”, der edi.","Qirolga qo‘ygan shartlari bilan sulh imzolatadi, lekin keyin qo‘shini og‘dirilib, o‘ldiriladi."]],
["Angliya","1215","Ioann (Angliya qiroli)","Richard I Sheryurak ning ukasi",["Genrix II vorislari Richard I Sheryurak va Ioann davrida qirol hokimiyati zaiflashadi.","Kenterberi arxiyepiskopi saylovida papa Innokentiy III bilan to‘qnashadi; papa uni cherkovdan haydab, butun Angliyada ibodatni taqiqlaydi (interdikt). Ioann taslim bo‘lib, papaning vasseli bo‘ladi, yiliga ming funt sterling to‘lashga rozi.","1215-yili zodagonlar, ritsarlar va shaharliklar qo‘zg‘olon ko‘tarib, Londonni egallaydi, qirolni asir oladi.","“Erkinlikning buyuk xartiyasi”ga (63 modda, lotin tilida) imzo chekishga majbur bo‘ladi: Buyuk kengash roziligisiz soliq yo‘q, erkin kishilar adolatli sud huquqiga ega, hukumat kuchi cheklangan. Lekin shartlarni bajarishni xohlamaydi."]],
["Angliya","XIII asr","Genrix III","Angliya qiroli, Ioannning vorisi",["Xartiyaga deyarli rioya qilmaydi, soliqlarni yanada oshirib hammani o‘ziga qarshi qiladi.","Simon de Monfor boshchiligidagi harakatda qirol va o‘g‘li shahzoda Eduard asir olinadi."]],
["Angliya","1265","Simon de Monfor","Yirik mulkdor, Angliya boshqaruvchisi",["Bir muddat Angliya boshqaruvini qo‘liga oladi.","1265-yili baronlar, ruhoniylar, har graflikdan ikki ritsar va har shahardan ikki vakil ishtirok etgan majlis chaqiradi – jahon tarixida “parlament” nomi bilan kiradi.","Uzoq boshqara olmaydi."]],
[22],
["Angliya","1295–1343","Eduard (Genrix III ning o‘g‘li)","Angliya qiroli",["Asirlikdan qochib, tez orada taxtga o‘tiradi; otasining xatolarini takrorlamaslikka harakat qiladi.","1295-yildan parlament doimiy chaqiriladi; 1297-yili soliqlarni tasdiqlash huquqi beriladi.","XIV asrdan qonun chiqarish va vazirlar ustidan Oliy sud huquqi; 1343-yili ikki palata: lordlar va umumpalata (har graflikdan ikki ritsar, shaharlardan ikki vakil)."]],
["Angliya","1377","Richard II","Angliya qiroli",["Davrida 1377-yili birinchi marta jon solig‘i (14 yoshdan yuqori barcha erkak va ayollar), 1380-yili 3 barobar oshiriladi.","1381-yilgi Uot Tayler qo‘zg‘olonida yosh qirol Londondagi Tauer qal’asiga yashirinadi, so‘ng qo‘zg‘olonchilar bilan uchrashib “Mayl End” dasturini qabul qiladi.","Ikkinchi muzokarada Uot Tayler o‘ldirilgach, qo‘zg‘olonchilar tor-mor etiladi."]],
["Angliya","1381","Uot Tayler","Qo‘zg‘olon yo‘lboshchisi (qishloq hunarmandi)",["“Tayler” – tunukasoz; Yuz yillik urush qatnashchisi, harbiy qobiliyatli.","1381-yili Esseks grafligida boshlangan qo‘zg‘olon 40 grafliikdan 25 tasini qamrab oladi; shahar kambag‘allari Londonga darvoza ochib beradi.","“Mayl End” dasturi: qaramlikni bekor qilish, umumiy afv, savdo erkinligi, 1 akr yerga 4 pens ijara. “Smitfild” dasturi: cherkov yerlaridan ajratish, jamoa yerlaridan erkin foydalanish, toifaviy tabaqalarni yo‘q qilish.","Ikkinchi muzokarada o‘ldiriladi. Jon Boll (“Odam Ato yer haydab, Momo Havo charx yigirganda kim zodagon bo‘lgan?”) qo‘zg‘olon rahbarlaridan biri, Jon Viklif g‘oyalari ta’sirida."]],
["Angliya","1399","Genrix IV (Lankaster)","Angliya qiroli",["1399-yili Lankasterlar sulolasi Angliya taxtiga keladi; xalq ishonchsizligidan Yorklar foydalanadi.","1403-yili Amir Temurga javob maktubi yo‘llaydi: savdogarlar daxlsizligi va do‘stlik haqida; maktub Mironshoh elchisi arxiyepiskop Ioann orqali keladi."]],
["Angliya","1485","Genrix VII Tyudor","Angliya qiroli, Tyudorlar asoschisi",["“Oq va Qizil gullar urushi” (1455–1485): Lankasterlar (qizil atirgul) va Yorklar (oq atirgul) 30 yil kurashadi; aholining 1/4 qismi va ko‘p zodagonlar qirilib ketadi.","1485-yili Bosvort jangida Yorklar mag‘lub bo‘ladi; Lankasterlar tarafdori Genrix VII taxtga o‘tiradi.","Eduard IV ning qiziga uylanib, gerbda qizil va oq atirgullarni birlashtiradi: Tyudorlar sulolasi (1485–1603)."]],
["Germaniya","1194–1250","Fridrix II","Shtaufenlar imperatori, “Jahon hayrati”",["1212-yili qirol, 1220-yili imperator; nemis va italyan millatiga mansub, Sitsiliyadan turib boshqargan.","Arab va Vizantiya madaniyatiga qiziqqan: arab va yunon tillarini bilgan, lotin maktublari va italyan she’rlari yozgan; Palermodagi saroyi sharqona uslubda; saroyida arab, vizantiyalik, yahudiy olimlari.","“Qushlar bilan ov qilish san’ati” kitobini yozgan; Neapol universitetiga asos solgan (hukmdor tomonidan asos solingan birinchi universitet).","Germaniyada hokimiyat amalda feodallar qo‘lida qoladi, u ularning shartlarini bajaradi.","Papa Grigoriy IX uni yeretik, Innokentiy IV shakkok deb e’lon qiladi; fuqarolarni qasamdan xoli etadi, unga qarshi salib yurishi tashkil etadi. 1248-yili mag‘lub, 1250-yili vafot; Shtaufenlar sulolasi tugaydi."]],
["Germaniya","1273","Rudolf Gabsburg","Imperator, Gabsburglar boshlovchisi",["1254–1273-yillarda imperator saylanmagan; 1273-yili knyazlar Rudolf Gabsburgni saylaydi.","Gabsburglar 1347-yilda Lyuksemburglarga bo‘shatib beradi (1347–1437); imperatorni 7 kurfyurst (4 dunyoviy knyaz, 3 arxiyepiskop) saylaydi.","1437-yili Gabsburglar qaytib 1806-yilgacha (369 yil) hukmronlik qiladi; Niderlandiya, Burgundiya qismi va Ispaniya toj-taxtini nikoh diplomatiyasi bilan qo‘lga kiritadi.","Imperator “tenglar ichida teng” – umumimperiya qo‘shini, soliqlari, markaziy sudi yo‘q."]],
[23],
["Italiya","1298–1380","Venetsiya dojlari","Saylangan rahbarlar, Venetsiya respublikasi",["Doj – VIII–XVIII asrlarda saylangan rahbar (120 doj); eng boy va nufuzli oilalardan; rasmiy hukumat – senat. Venetsiya savdo-oligarxiya respublikasi.","1298-yili genuyaliklar Venetsiya flotini mag‘lub etganda venetsiyalik doj va Marko Polo asir tushadi; Marko Polo asirlikda sayohat tarixini aytib beradi.","1380-yili Venetsiya Genuyani tamomila yengadi: Qora dengizga kirish huquqi va sharqiy O‘rta dengizda savdo monopoliyasi.","Dojlar saroyi (1309–1424-yillarda hozirgi ko‘rinishga keltirilgan) – gotika yodgorligi."]],
["Papalik","1377–1378","Grigoriy XI","Rim papasi",["1377-yili Avinyondan Rimga ko‘chib keladi va 1378-yili Rimda vafot etadi."]],
["Papalik","1378","Urban VI va Kliment VII","Ikki papa – “Buyuk bo‘linish”",["Saylovda italiyalik va fransuz kardinallari ikki nomzod ko‘rsatadi: italiyaliklar Urban VI ni (qarorgohi Rim), fransuzlar Kliment VII ni (qarorgohi Avinyon) saylaydi.","Yevropa mamlakatlari ham ikkiga bo‘linadi."]],
["Papalik","1409","Aleksandr V","Piza yig‘ini papasi",["1409-yili Pizadagi yig‘inda ikkala papa ham voz kechmagani uchun yangi papa saylanadi – katolik cherkovida rasman uchta papa: “Buyuk bo‘linish”."]],
["Papalik","1418","Martin V","Yagona papa",["1418-yilgi yig‘inda uchala papa ham ag‘darilib, Martin V saylanadi; qarorgohi Rim. “Buyuk bo‘linish”ga barham beriladi."]],
["Ispaniya va Portugaliya","XIII asr","Alfonso X","Kastiliya qiroli",["Kortes (toifa vakillari yig‘ini) shaharliklar va dehqonlar vakillarini ham qabul qila boshlaydi; qirol zodagonlarga qarshi kurashda shaharliklarga tayanadi.","Rim huquqiga asoslangan “Huquqning yetti bo‘limi” qonunlar to‘plamini yaratadi.","Ispan tilida yirik asarlar va Ispaniya tarixini yozish, ilmiy matnlarni arab tilidan ispan tiliga tarjima qilish tashabbusi; Kastiliya tili ispan adabiy tiliga asos bo‘ladi.","Toledo maktabi Yevropa tarjimashunosligining beshigiga aylanadi (O‘rta Osiyo olimlari asarlari ham tarjima qilinadi); Salamanka universitetida rasadxona qurdiradi, astronomik jadvallar tuzishda ishtirok etadi."]],
["Ispaniya va Portugaliya","XIV asr","Pedro I","Kastiliya qiroli",["Yuz yillik urushda Angliyaning ittifoqchisi sifatida qatnashadi; yirik mulkdorlarga qarshi qattiq kurash olib boradi.","Keyingi qirollar davrida markazlashgan hokimiyat nufuzi pasayadi."]],
["Ispaniya va Portugaliya","1402–1403","Genrix III de Trastamara","Kastiliya qiroli",["Amir Temur davlati bilan diplomatik yozishmalar olib boradi.","1402-yili Payo Sotomayor va Ernan Sanches boshchiligidagi elchilarni Amir Temurning Kichik Osiyodagi qarorgohiga yuboradi; Sohibqiron ularga o‘z elchisi Muhammadqozi orqali maktub va sovg‘alar jo‘natadi.","1403-yili Rui Gonsales de Klavixo boshchiligida ikkinchi elchilik yo‘llaydi; Klavixo 1404-yil avgustda Samarqandga yetadi, 1406-yili Kastiliyaga qaytib hisobot topshiradi (“Esdaliklar”, 1582-yili birinchi marta Sevilyada chop etilgan)."]],
[24],
["Ispaniya va Portugaliya","1469","Ferdinand va Izabella","Aragon shahzodasi va Kastiliya malikasi",["1469-yili turmush qurishlari Ispaniyani birlashtirishda katta qadam bo‘ladi: Kastiliya va Aragon alohida kengash va parlamentlarga ega, ammo yagona siyosiy qirollik.","1492-yili Granada amirligi (Yevropadagi so‘nggi arab davlati) qulab, rekonkista yakunlanadi; 1512-yili Ferdinand Navarrani egallaydi. Portugaliyadan tashqari butun Pireney yarimoroli birlashadi."]],
["Ispaniya va Portugaliya","905","Sancho Garsiya","Navarra davlatining birinchi qiroli",["Navarra (905–1512, poytaxt Pamplona) – 1076–1134-yillarda Aragonga tobe; XIII asr o‘rtalarida fransuzlar egallagan."]],
["Ispaniya va Portugaliya","868–XV asr","Portugaliya hukmdorlari","Vimara Peresh – Afonso Enrikesh – Dinish – Xuan I",["868-yili Vimara Peresh boshchiligida Portugaliya grafligi tuziladi.","1139-yili Afonso Enrikesh mustaqillikni e’lon qilib, birinchi qirol bo‘ladi; 1225-yildan poytaxt – Lissabon.","Sancho I davrida tinch islohotlar; Afonso II dan kortes (parlament) ish boshlaydi.","Qirol Dinish Portugaliya flotiga va Koimbra universitetiga asos soladi.","XV asrda Avislar sulolasidan Xuan I dan mustamlaka siyosati boshlanadi. Vasko da Gama 1498-yili Hindistonni, Pedro Kabral 1500-yili Braziliyani kashf etadi."]],
["Rossiya","XII asr","Mstislav I va Vsevolod Mstislavich","Kiyev knyazi va Novgorod knyazi",["Vladimir Monomaxning o‘g‘li Mstislav I vafotidan so‘ng XII asrning birinchi yarmida Kiyev Rusi 10 dan ortiq mustaqil knyazlikka bo‘linadi.","1136-yili Novgorodda knyaz Vsevolod Mstislavich taxtdan ag‘dariladi, respublika boshqaruvi o‘rnatiladi (veche; knyaz veche bilan shartnoma tuzgan va shahar ishlariga aralasha olmagan)."]],
["Rossiya","XII asr","Rostislav Mstislavich","Smolensk knyazi",["Uning davrida Smolensk o‘lkasi Kiyevdan mustaqil bo‘ladi."]],
["Rossiya","1130-yillar","Yuriy Dolgorukiy","Vladimir-Suzdal knyazi",["Poytaxtni Rostovdan Suzdalga ko‘chiradi; 1147-yili Moskva shahriga asos soladi. Vorisi Andrey davrida poytaxt Vladimir shahriga ko‘chiriladi."]],
["Rossiya","1240–1242","Aleksandr Nevskiy","Novgorod knyazi (Aleksandr Yaroslavich)",["1240-yili Neva daryosi bo‘yida shvedlarni mag‘lub etadi – shundan “Nevskiy”.","Zodagonlar nufuzidan qo‘rqib uni Novgoroddan chiqarib yuboradi, lekin Livoniya ritsarlari Izborsk va Pskovni olgach, aholi talabi bilan qaytarib qo‘mondon bo‘ladi.","1242-yil 5-aprel Chud ko‘li ustida (“Muz ustidagi jang”) nemis ritsarlarini yengadi, Novgorod va Pskov mustaqilligi saqlanadi."]],
["Rossiya","1263–1340","Daniil Aleksandrovich va Ivan Kalita","Moskva knyazlari",["1263-yili Daniil Aleksandrovich Moskva va atrofini, Moskva knyazligiga asos soladi.","Ivan Kalita (1325–1340) 1327-yili Oltin O‘rda hukmdoridan rus yerlarida soliq yig‘ish huquqini oladi; ko‘plab knyazliklarni o‘z tarkibiga qo‘shadi."]],
["Rossiya","1380","Dmitriy Donskoy","Moskva knyazi (Dmitriy Ivanovich)",["Moskvani harbiy jihatdan mustahkamlaydi.","1380-yili Don daryosi bo‘yidagi Kulikovo maydonida Oltin O‘rda tumanboshisi Mamay qo‘shinini yengadi – shundan “Donskoy”.","1382-yili To‘xtamishxon Moskvani bosib oladi, ruslar yana soliq to‘laydi."]],
[25],
["Rossiya","1478–1480","Ivan III","Moskva knyazi",["1478-yili Novgorod mustaqilligini tugatadi: veche yo‘q qilinadi, qo‘ng‘irog‘i Moskvaga olib ketiladi.","1480-yili Oltin O‘rda urinishi muvaffaqiyatsiz tugab, soliq to‘lashni butunlay to‘xtatadi – ikki asrlik qaramlik tugaydi.","Davrida Novgorod, Tver va boshqa hududlar qo‘shilib, Moskva knyazligi Rossiya davlatiga aylanadi. Ivan IV 1547-yili podshoh unvonini oladi."]],
["Bolqon va Markaziy Yevropa","1187","Asen va Asen II","Ikkinchi Bolgariya podshohligi hukmdorlari",["Bolgariya Vizantiyaga 1018–1187-yillarda (~170 yil) qaram bo‘lgan; 1187-yili zodagon Asen qo‘zg‘olon ko‘tarib, Ikkinchi Bolgariya podshohligining birinchi hukmdori bo‘ladi.","Vorisi Asen II davrida Bolqondagi eng katta mamlakat: Frakiya, Makedoniya, Epir, Fessaliya qismi qo‘shiladi; birinchi marta oltin pul zarb qilinadi.","XIV asrda Tirnovo, Vidin, Dobrujaga bo‘linib, 1396-yili Usmoniylarga qaram bo‘ladi."]],
["Bolqon va Markaziy Yevropa","1331–1355","Stefan II va Stefan Dushan","Nemanya sulolasi, Serbiya qirollari",["Stefan II davrida Serbiya Vizantiyadan mustaqil bo‘lib, qirollikka aylanadi.","Stefan Dushan (1331–1355) davrida Bolqonning eng qudratli davlatlaridan biri; tabaqalar huquq-burchlari, soliq va iqtisodiy munosabatlarni belgilovchi “Qonunlar to‘plami” qilinadi.","Vafotidan so‘ng Serbiya parchalanib, turklar qaramligiga tusha boshlaydi."]],
["Bolqon va Markaziy Yevropa","XIII–XIV asr","Pshemisl II va Yan Lyuksemburg","Chexiya qirollari",["Pshemisl II davrida Chexiya Yevropadagi rivojlangan davlatlardan biri: hududi Adriatika dengizi janubigacha kengayadi; u nemis imperatorligiga ham nomzod qo‘yadi, muvaffaqiyatsiz.","Yan Lyuksemburg davrida ruhoniylar, panlar va ritsarlardan iborat seym muntazam chaqiriladi."]],
["Bolqon va Markaziy Yevropa","1415–1419","Yan Gus va Sigizmund","Chex islohotchisi va qirol",["Yan Gus (1371–1415): Praga universiteti professori va rektori, indulgensiya savdosini qoralaydi, chex tilini va va’z qiladi, cherkov papaga emas, qirolga bo‘ysunishi kerak deydi. Konstansada himoya yorlig‘iga qaramay qamoqqa olinib, 1415-yili gulxanda yoqiladi.","1419-yili Pragada qo‘zg‘olon (guschilar harakati): qirol ag‘dariladi; yangi qirol Sigizmund bostira olmaydi. Chexiya Germaniya imperiyasidan ajralib mustaqil bo‘ladi; harakat 1434-yili bostiriladi."]],
["Bolqon va Markaziy Yevropa","XIV asr","Vladislav I va Kazimir III","Polsha qirollari",["Piastlar sulolasi (960–1385) davrida knyaz Boleslav III dan keyin Polsha mayda viloyatlarga bo‘linadi; tevton ordeni Prussiya va Pomoryeni bosadi.","Knyaz Vladislav I Polshani birlashtirib, qirollik mavqeyini tiklaydi.","Uning o‘g‘li Kazimir III davrida qirollik eng qudratli: markaziy idora tiklanadi, savdo jonlanadi, yo‘llar, shaharlar, qo‘rg‘onlar quriladi, pul muomalasi tartibga solinadi. XV asrda ikki palatali seym tashkil topadi."]],
["Bolqon va Markaziy Yevropa","1000","Ishtvan Buyuk","Vengriya birinchi qiroli, Arpadlar",["1000-yili toj kiyadi; Vengriya xristianlikni qabul qiladi; mamlakatni birlashtirib, papadan qirol unvonini oladi; venger bo‘lmaganlarga bag‘rikeng (Yevropa adabiyotida Stefan)."]],
["Bolqon va Markaziy Yevropa","XIII–XIV asr","Andrash II va Layosh","Vengriya qirollari",["Arpadlardan Andrash II davrida “Oltin bulla” qabul qilinadi (Angliya xartiyasiga qiyoslanadi): ishpanlar vakolati cheklanadi, ritsarlar soliqdan ozod bo‘ladi va davlat yig‘ilishlarida qatnashadi.","1240-yili Botuxon mo‘g‘ullari Vengriyani bosib oladi; 1301-yili Arpadlar sulolasi tugaydi, 1308-yili Anjuy sulolasi taxtni egallaydi; qirol Layosh davrida Vengriya qudratli davlatga aylanadi."]],
[26],
["Usmoniylar","1299–1326","Ertug‘rul va Usmon I","Usmon beyligi asoschilari",["Ertug‘rul o‘g‘uz qabilasi bilan saljuqiy sulton Alouddin Qayqubod II dan ruxsat olib Vizantiya chegarasidagi Eskishaharga joylashadi, beylik yerlarini kengaytiradi.","Uning o‘g‘li Usmon I (1299–1326) davrida beylik mustaqil davlatga aylanadi, Melangiyani oladi; saljuq sultonlaridan nog‘ora va tug‘ olib 1299-yili mustaqillikni e’lon qiladi – Usmoniylar davlati asoschisi.","Usmon davrida Bursa va atrofi egallanadi."]],
["Usmoniylar","XIV asr","O‘rxon","Usmoniy bey",["Nikeya va Nikomediya shaharlarini egallaydi; Bursani poytaxt qiladi, 1327-yili birinchi marta kumush tanga zarb qilinadi.","Harbiy islohot: piyoda (yayov) va otliq (musallam) doimiy qo‘shin tuziladi; ilk bor vazir lavozimi ta’sis etiladi; ulamolar boshqaruvchi va qozi sifatida jalb qilinadi."]],
["Usmoniylar","1362–1389","Murod I","Usmoniy sulton",["Davridan hukmdorlar “sulton” deb ataladi.","1365-yili yanichar (“yangi qo‘shin”) zarbdor bo‘linmasini tuzadi (asir olingan 8–16 yoshli xristian bolalardan).","Adrianopolni olib (1362), Edirna nomi bilan poytaxt qiladi; Rumeliya viloyati ta’sis etiladi.","1389-yili Kosovo maydonida g‘alaba qozonib, turklar Bolqonning yakka xo‘jayiniga aylanadi; Serbiya yurishida serb jangchisi Miloxh Obilich tomonidan o‘ldiriladi."]],
["Usmoniylar","1389–1402","Boyazid I","Usmoniy sulton",["Qisqa vaqtda Bolgariya va grek knyazliklarini bo‘ysundiradi, Albaniyaning bir qismini egallaydi, Anatoliyaning g‘arbiy va markaziy turk beyliklarini tobe qiladi; Konstantinopolni qamal qiladi.","Amir Temurga qarshi ayirmachilar harakatini qo‘llab-quvvatlaydi; 1402-yil iyulda Anqara jangida yengilib, asir olinadi."]],
["Usmoniylar","1413–1451","Mehmed I va Murod II","Usmoniy sultonlari",["Mehmed I (1413–1421) Usmoniylar harbiy qudratini qayta tiklaydi va Vizantiyani bo‘ysundirish uchun kurash boshlaydi.","Murod II davrida Konstantinopol bir necha marta qamal qilinadi, lekin egallanmaydi."]],
["Usmoniylar","1451–1481","Mehmed II (Fotih)","Usmoniy sulton",["Og‘ir artilleriyaga e’tibor qaratib, katta flot yaratadi; 1453-yil 29-may ikki oylik qamaldan so‘ng Konstantinopolni egallaydi.","So‘nggi imperator Konstantin XI Paleolog jangda halok bo‘ladi, Sharqiy Rim imperiyasi quladi.","Shahar Istanbul deb nomlanib, poytaxt bo‘ladi; Ayo Sofiya sultonning asosiy masjidiga aylantiriladi."]],
["Usmoniylar","1517","Salim I","Usmoniy sulton",["Misrni bosib olgach, Qohiradagi xalifa taxtni unga topshiradi. Usmoniylar xalifalik markazi, sultonlar barcha musulmonlarning yagona xalifasi (1517–1924)."]],
["Eron","1256–1258","Huloku","Hulokuiylar (Elxoniylar) asoschisi",["Chingizxonning nabirasi, Tuluning o‘g‘li; ulug‘ xon Munke topshirig‘i bilan 1256-yili 70 ming qo‘shin bilan Eronni to‘liq egallaydi; “elxon” (ulus xoni) unvoni beriladi.","Davlatga Eron, Afg‘oniston, Turkmanistonning katta qismi, Kavkazorti, Iroq va Kichik Osiyoning sharqiy qismi kiradi.","Mo‘g‘ul istilosi shaharlarni vayron qilgan, soliqlar og‘ir, qarzdorlar qul qilingan; qo‘zg‘olonchi guruhlar vujudga keladi."]],
["Eron","1295–1304","G‘ozonxon","Yettinchi elxon",["Vaziri Rashiduddin (qomusiy olim) bilan ma’muriy va iqtisodiy islohotlar: markazlashtirish, soliq tizimini tartibga solish.","1295-yili islomni qabul qilib, qurultoyda uni davlat dini deb e’lon qiladi.","Pul islohoti: 2,15 grammli kumush dirham va 12,9 grammli oltin dinor (keyin Chig‘atoy ulusida ham joriy).","Xo‘jalik birmuncha yaxshilanadi, lekin yer egalari soliqdan bosh tortadi; Abu Said vafotidan so‘ng yagona elxon qolmaydi, davlat bo‘linadi."]],
[27],
["Eron","1337–1381","Vojihiddin Mas’ud","Sarbadorlar sultoni",["1337-yili Sabzavor yaqinidagi Boshtin qishlog‘ida mo‘g‘ullar va mulkdorlar zulmiga qarshi qo‘zg‘olon (“sarbadorlar” – boshini dorga tikkanlar); Sabzavor va Xurosonda o‘z davlatlarini tuzadilar.","Xiroj hosilning 1/3 qismi; 12 ming kishilik doimiy maoshli qo‘shin.","Ichki birlik yo‘qligi sababli, Amir Temur 1381-yili Sabzavorni egallab, davlatga barham beradi."]],
["Eron","1314–1358","Muboriziddin Muhammad","Muzaffariylar asoschisi",["Mo‘g‘ullarning Yazddagi noibi; Hulokuiylar inqirozidan foydalanib Kirmon, Fors, Isfahonni qo‘shib, Janubiy Eronda hokimiyat o‘rnatadi; poytaxt Sheroz.","Shoh Mansur davri; sulola vakillari o‘zaro urushdan zaiflashadi, 1387–1393-yillarda Amir Temur Muzaffariylarni tugatadi."]],
["Eron","1340–1374","Hasan Buzurg va Uvays I","Jaloyiriylar sultonlari",["Shayx Hasan Buzurg 1340-yili o‘zini sulton deb e’lon qilib, Jaloyiriylar davlatiga asos soladi; poytaxt – Bag‘dod.","Uvays I (1356–1374) davrida davlat juda yuksaladi; to‘rtinchi o‘g‘li Ahmad davrida tahdidlar kuchayadi.","Amir Temur Tabriz va Bag‘dodni olgach, Jaloyiriylar tobe bo‘ladi; XV asr 30-yillarida Qora qo‘yunlilar davlatni tugatadi."]],
["Eron","1387–1410","Qora Yusuf","Qora qo‘yunlilar yo‘lboshchisi",["1387-yili Tabrizni egallab mustaqil harakat qiladi; Amir Temurdan yengilib, Misr sultoni Barquq qarorgohidan panoh topadi.","Temur vafotidan so‘ng Ahmad Jaloyiriy bilan ittifoq tuzadi, temuriyzoda Abu Bakr va Mironshoh qo‘shinini yengadi; 1410-yili Tabriz va Bag‘dodni olib, Qora qo‘yunlilar davlatiga asos soladi.","Qora Yusuf va Iskandar davrida temuriylar va shirvonshohlar bilan urushlar; 1435-yili Shohrux Mirzo Qora qo‘yunlilar qo‘shinini tor-mor etadi."]],
["Eron","1453–1478","Uzun Hasan","Oq qo‘yunlilar hukmdori",["1468-yili Qora qo‘yunlilarni yengib, barcha hududlarini oladi, Qora qo‘yunlilar davlati tugaydi; Oq qo‘yunlilar davlati poytaxti Tabriz (G‘arbiy Eron, Kurdiston, Armaniston va Ozarbayjon qismi).","1469-yilgi jangda temuriy sulton Abu Said halok bo‘ladi; Usmoniylarga qarshi kurashda muvaffaqiyatsiz.","Keyin davlat ikkiga bo‘linadi; 1502-yili Safaviylar Oq qo‘yunlilarni mag‘lub etib, Eronni yagona davlatga birlashtiradi."]],
["Oltin O‘rda","1237–1242","Jo‘ji va Botuxon","Oltin O‘rda asoschilari",["Chingizxonning to‘ng‘ich o‘g‘li Jo‘ji ulusi eng katta hudud: Irtishdan Volgabo‘yigacha.","Uning o‘g‘li Botuxon 1237–1242-yillarda Rus va Sharqiy Yevropada Polsha, qisman Serbiya, Bolgariya, Chexiya va Vengriyani bosib olib, Oltin O‘rda davlatiga asos soladi.","Qoraqurumdagi saroy ishlariga aralashib jiyani Munkeni ulug‘ xon qildirib, eng nufuzli chingizxoniy bo‘ladi; qarorgohida oltin chodir (shundan “Oltin O‘rda”). Rus knyazlari soliq to‘lab, xondan yorliq olgan."]],
["Oltin O‘rda","1255–1266","Berkaxon","Jo‘ji ulusining birinchi hukmdori",["Botuxon ukasi; ulug‘ xon ruxsatisiz hokimiyatga keladi.","Xubilay ulug‘ xon bo‘lgach, uning hokimiyatini tan oladi, lekin itoat qilmay Oltin O‘rdani mustaqil boshqaradi.","Poytaxt Yangi Saroyga (Saroy Berka) ko‘chiriladi."]],
["Oltin O‘rda","1266–1282","Mangu Temur","Oltin O‘rda xoni, Botuning nabirasi",["1269-yili o‘z mulklarini Mo‘g‘ullar imperiyasidan mustaqil deb e’lon qiladi; o‘z nomidan tanga zarb qiladi.","Hulokuiylar bilan Kavkazorti uchun raqobat; Misr sultonlari bilan ittifoq."]],
[28],
["Oltin O‘rda","1312–1357","O‘zbekxon va Jonibekxon","Oltin O‘rda xonlari",["O‘zbekxon (1312–1342): imperiyani 70 tumanga bo‘lib, ularni ulusbegilar boshchiligidagi 10 yirik viloyatga birlashtiradi; ayirmachilikni bostiradi.","1314-yili islomni davlat dini deb e’lon qiladi, boshqa dinlarga erkinlik beradi; qo‘shini 300 mingdan oshadi; taxti oltin bilan qoplangan (Ibn Battuta).","Jonibekxon (1342–1357) davrida Saroy Berka aholisi 100 ming kishiga yetadi.","Vafotidan so‘ng 25 yilda 20 xon almashadi."]],
["Oltin O‘rda","1380–1395","To‘xtamishxon","Oltin O‘rda xoni",["Amir Temur yordami bilan taxtni egallaydi, davlat birligini qayta tiklaydi.","1382-yili Moskvani bosib olib, ruslarni yana soliq to‘lashga majbur qiladi.","Temurga qarshi ittifoq tuzishga urinadi; 1389, 1391, 1395-yillarda janglar; 1395-yil Terak daryosi bo‘yida to‘liq mag‘lub bo‘ladi – Oltin O‘rda inqirozi tezlashadi."]],
["Oltin O‘rda","1502","Mengli Garay","Qrim xoni",["1502-yili Oltin O‘rda qo‘shinini uzil-kesil mag‘lub etib, davlat parchalanib ketadi (Astraxan, Qozon, Qozoq, Qrim, Sibir xonliklari va No‘g‘ay O‘rdasi)."]],
["Oltin O‘rda","1380","Mamay","Oltin O‘rda tumanboshisi",["Rus yerlarining birlashishidan xavfsirab, Moskvaga hujum qiladi; 1380-yili Kulikovo maydonida Dmitriy Donskoydan mag‘lub."]],
["Hindiston","1206–1236","Qutbiddin Oyboq va Eltutmish","Dehli sultonligi asoschilari",["Qutbiddin Oyboq (1206–1210) 1206-yili Dehli sultonligiga asos solib, turkiy qabilalardan qo‘shin tashkil qiladi.","Turk g‘ulomi Shamsiddin Eltutmish (1211–1236) Panjob, Sind, Bengaliyani qo‘shib hududni kengaytiradi; 1229-yili Bag‘dod xalifasi Mustansir uni mustaqil hukmdor deb e’tirof etadi."]],
["Hindiston","1236–1240","Roziya","Dehli sultoni",["Eltutmishning to‘ng‘ich qizi: adolatpesha, xalqparvar; otasi uni merosxo‘r etib tayinlagan, lekin o‘g‘illari taxt uchun kurashadi.","Xalq va hokimlar 1236-yili uni taxtga o‘tqazadi – sultonlikning yagona va Osiyoning birinchi musulmon ayol hukmdori.","Isyonlarni bostiradi, adolatli qonunlar chiqaradi, tanga zarb ettiradi, fan va san’at homiysi. 1240-yil aprelda turk zodagonlari uni ag‘daradi."]],
["Hindiston","1290–XIV asr","Jaloliddin Feruz shoh va Alouddin Xiljiy","Xiljiylar sulolasi",["Jaloliddin Feruz shoh 1290-yili hokimiyatni olib, xiljiylarga asos soladi; musulmonlar mulki Janubiy Hindistongacha yetadi.","Alouddin Xiljiy kuchli qo‘shin tuzib feodallarni bo‘ysundiradi; Dekan, Gujarot, Rajastonni egallaydi; mo‘g‘ullar hujumini qaytaradi.","Bozor narxlarini belgilaydi: ayg‘oqchilar “sinov xaridlari” o‘tkazadi, narx oshsa jarima; kerak bo‘lsa davlat omboridan g‘alla chiqariladi."]],
["Hindiston","1325–XIV asr","Muhammad Tug‘luq va Feruzshoh Tug‘luq","Tug‘luqlar sultonlari",["Muhammad Tug‘luq (1325–1351) o‘zini “Iskandar Zulqarnaynning davomchisi” deb atab, deyarli butun Hindistonni bo‘ysundiradi.","Feruzshoh davrida soliqlar kamaytiriladi, davlat yerlari dehqonlarga ijaraga beriladi, qo‘shimcha boj va yig‘imlar bekor qilinadi, bunyodkorlik – “xalq homiysi”."]],
["Hindiston","1398–1451","Sulton Mahmudxon va Xizr Xon","Dehli hukmdori va Sayyidlar asoschisi",["1398-yili Amir Temur Mahmudxon qo‘shinlarini yengib, Dehlini zabt etadi; Xizr Xonni noib qilib tayinlab, hind hunarmandlari va me’morlarini Samarqandga olib ketadi.","Temur vafotidan so‘ng Xizr Xon hokimiyatni olib Sayyidlar sulolasiga asos soladi; hokimiyat Dehli atrofidan nariga o‘tmaydi."]],
[29],
["Hindiston","1451–1517","Bahlul va Iskandar Lo‘diy","Lo‘diylar sulolasi",["Afg‘on urug‘i boshlig‘i Bahlul Lo‘diy 1451-yili Dehlini egallab, o‘zini sulton deb e’lon qiladi; saltanat mustahkamlanadi.","Iskandar (1489–1517) qudratni mustahkamlab, poytaxtni Dehlidan Agraga ko‘chiradi."]],
["Hindiston","1526","Ibrohim Lo‘diy va Bobur","So‘nggi sulton va Bobur Mirzo",["Ibrohim Lo‘diy mutlaq hokimiyat siyosatini yuritadi, zodagonlar Kobuldagi Bobur Mirzodan yordam so‘raydi.","Zahiriddin Muhammad Bobur 1526-yil 21-aprelda Ibrohim qo‘shinini tor-mor etib, Hindistonni egallaydi; Dehli sultonligi parchalanadi (1206–1526)."]],
["Amir Temur","1380–1405","Amir Temur (Sohibqiron)","Movarounnahr hukmdori – 8-sinfda uchragan faoliyati",["Oltin O‘rda: To‘xtamishni 1395-yili Terak daryosida yengib, ruslarning mo‘g‘ullar zulmidan xalos bo‘lishini tezlashtirdi; 1480-yili ruslar soliq to‘lashni to‘xtatadi.","Usmoniylar: Anqara jangida (1402) Boyazidni yengib asir oladi, mulklarni uning o‘g‘illariga bo‘lib beradi.","Eron: Sarbadorlarni (1381), Muzaffariylarni (1387–1393), Jaloyiriylarni tugatadi, Tabriz va Bag‘dodni oladi, Eronni siyosiy tarqoqlikdan chiqaradi.","Hindiston: 1398-yili Dehlini zabt etadi.","Xitoy: 1404-yil oxirida yurish boshlaydi, yo‘lda vafot etadi (Min imperatori Yongle va Ulug‘bek davlatlari bilan aloqa o‘rnatadi).","Yevropa: Karl VI (Fransiya), Genrix IV (Angliya), Genrix III (Kastiliya) bilan elchilik va savdo aloqalari; arxiyepiskop Ioann va Klavixo elchilari."]],
["Xitoy","1260–1279","Xubilay","Mo‘g‘ullar ulug‘ xoqoni, Yuan sulolasi asoschisi",["1260-yili Tuluxonning o‘g‘li Xubilay ulug‘ xoqon deb e’lon qilinadi; 1279-yili Xitoyni to‘liq egallab, Sun sulolasini tugatadi va Yuan sulolasiga (1279–1368) asos soladi. Poytaxt – Xonbaliq (Pekin).","Birma, Kambodja va Koreyani bo‘ysundiradi, Vyetnam vassalga aylanadi; o‘zini Osmon o‘g‘li deb e’lon qiladi; imperiyani 12 viloyatga bo‘ladi; poytaxtda uch markaziy boshqaruv organi tuziladi (keyingi Min va Chin sulolalari uchun asos).","Mahalliy amaldorlardan foydalanilmaydi; Marko Polo uning saroyida yuqori lavozimda xizmat qilgan.","Yaponiyaga elchi yuboradi, syogun elchilarini qatl ettiradi; 1274 va 1281-yillarda yuborilgan ulkan flot tayfunda halok bo‘ladi (4000 kema, 100 ming askar).","Mo‘g‘ul zodagonlari yerlarida dehqonlar qaram va sotiladigan; Xuanxe toshqini ocharchilikka olib keladi; Yuan inqirozga yuz tutadi."]],
