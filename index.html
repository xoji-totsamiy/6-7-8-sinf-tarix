["Xitoy","1368","Chju Yuan Chjan","Min sulolasi asoschisi, sobiq rohib",["“Qizil peshonabog‘lilar” qo‘zg‘oloni (1351–1368) ishtirokchisi; 1368-yili Nankinni egallab o‘zini imperator deb e’lon qiladi: Min (“yorug‘lik”) sulolasi (1368–1644).","1370-yili soliqlarni aniqlashtirish uchun aholi ro‘yxatga olinadi; soliqlar kamaytirilib, yiliga ikki marta undiriladi; qullarni ozod qilish qonuni; mo‘g‘ul va yirik mulkdorlar yerlari musodara qilinib yersiz dehqonlarga beriladi; ocharchilik uchun omborlar.","Poraxo‘rlik va jinoyatga qarshi qattiq kurash: xalqqa zulm qilgan amaldorlar og‘ir jazolanadi.","Uch bosqichli imtihon tizimi qayta tiklanadi, qishloq maktablari ochiladi. 1387–1388-yillarda mo‘g‘ullarning asosiy kuchlari yanchib tashlanib, Yuan butunlay tugatiladi."]],
["Xitoy","1402–1424","Yongle","Min imperatori",["Imperiya yuksalishi uning davridan boshlanadi; poytaxt Nankindan Pekinga ko‘chiriladi (1421).","Buyuk Kanal deyarli qayta quriladi – yagona suv yo‘li; ekin maydonlari bir necha baravar ko‘payadi; Min imperiyasining “oltin davri”.","1408-yili “Yongle ensiklopediyasi”.","Admiral Chjan Xe (asli Mahmud, buxorolik zodagon avlodi) boshchiligida 1405–1433-yillarda 250 ga yaqin ulkan kema, 70 amaldor va 30 ming jangchili ekspeditsiyalar: Janubi-Sharqiy Osiyo, Seylon, Hindiston, Fors ko‘rfazi, Arabiston, Afrika.","Amir Temur vafotidan so‘ng Shohrux va Ulug‘bek davlatlari bilan munosabat o‘rnatadi."]],
[30],
["Xitoy","XV asr","Cheng Xua","Min imperatori",["Mo‘g‘ullarga qarshi kurash olib boradi; 200 ming askar Buyuk Xitoy devorining 600 km qismini quradi, devor hozirgi holatiga keltiriladi."]],
["Yaponiya va Koreya","1185–1192","Minamoto Yoritomo","Birinchi syogun, Kamakura syogunligi",["1156-yili Tayra va Minamoto xonadonlari urush boshlaydi; Yoritomo 1185-yili barcha raqiblarini mag‘lub etadi.","Imperatorga sodiq samuray sifatida mikado hokimiyatini saqlaydi, lekin uning o‘rniga hukmronlik qiladi: 1192-yili syogun unvonini oladi, markazlashgan hukumat tuzadi. Kamakura syogunligi (1192–1333).","Imperator (mikado – Amaterasu o‘g‘li) nomigagina hukmdor; haqiqiy hokimiyat syogunda."]],
["Yaponiya va Koreya","1274–1281","Kamakura syogunlari","Mo‘g‘ullarga qarshi kurash",["Xubilay bo‘ysunishni talab qilib yuborgan elchilarni syogun qatl ettiradi.","1274-yili mo‘g‘ul floti tayfunda cho‘kadi; 1281-yili Xakata ko‘rfazida yaponlar uzun tosh devor qurib otliqlarni qaytaradi, kuchli tayfun (“kamikadze” – ilohiy shamol) flotni yo‘q qiladi.","Zodagonlar urushdagi xizmatiga yetarli baho berilmaganidan norozi bo‘ladi."]],
["Yaponiya va Koreya","1333–1338","Asikaga","Kioto syogunligi asoschisi",["Norozi oilalar bilan birlashib 1333-yili Kamakura syogunligini ag‘daradi, Kiotoni egallab imperatorni Yosinoga ko‘chiradi.","1338-yili syogun unvonini olib Kioto syogunligiga (Asikagalar, 1338–1573) asos soladi.","Syogun Yoshimitsu Asikaga davrida daymyolar syogunga qarshi ittifoq tuzadi; 1467–1477-yillarda “Onin urushi” poytaxt Kiotoni vayron qiladi."]],
["Yaponiya va Koreya","1356–1368","Konmin","Koryo hukmdori",["1356-yili mo‘g‘ullar tarafdori amaldor va zobitlarni lavozimidan chetlatadi, mo‘g‘ullar joriy qilgan qonunlarni bekor qiladi.","1368-yili Xitoyda mo‘g‘ullar hukmronligi tugagach, Koryo Yuan imperiyasiga qaramlikdan xalos bo‘ladi."]],
["Yaponiya va Koreya","1392","Li Son Ge (Taejo)","Choson qirolligi asoschisi, Li sulolasi",["Koryo sarkardasi, Min bosqinlariga qarshi kurash boshlab 1392-yili davlat to‘ntarishini amalga oshiradi: so‘nggi hukmdorni ag‘darib, Li sulolasiga asos soladi; Taejo nomi bilan taxtga o‘tadi, davlatni Choson deb e’lon qiladi.","Poytaxt – Xanson (Seul); Kyonbokkun saroyi, yo‘llar, bozorlar qurdiradi; markazlashtirish islohotlari; Koreyani Xitoyning vassali sifatida tan olishga majbur bo‘ladi.","Min imperiyasiga (imperator Xongvu tan olishga shoshilmaydi) va Yaponiyaga elchilar yuboradi; syogundan qaroqchilarga qarshi yordam so‘raydi."]],
["Yaponiya va Koreya","1400–1450","Taejong va Sejong","Choson qirollari",["Taejong (1400–1418): amaldorlar poytaxtdan tayinlanadi va vaqti-vaqti bilan almashtiriladi; 1402-yili shikoyatlar uchun “katta do‘mbira”; 1413-yili aholini ro‘yxatga olish va shaxsni tasdiqlovchi “taxta bo‘lagi”; zodagonlar qo‘shinlarini tarqatadi, Davlat kengashi tuziladi.","Sejong (1418–1450, “Buyuk Sejong”): qishloq xo‘jaligini rivojlantiradi, ekin maydonlari kengayadi, davlat omborlari to‘ldiriladi, soliq hosilga qarab belgilanadi, dehqonlar ortiqcha donini sota oladi.","Yaponiya bilan hamkorlikda qaroqchilarga chek qo‘yadi, shimoliy chegarada qal’alar quradi; qirollik akademiyasini tashkil etadi."]],
[31],
["Yaponiya va Koreya","1469–1494","Seongjong","Chosonning to‘qqizinchi qiroli",["Nisbatan barqarorlik va farovonlik; “Davlat boshqaruvi to‘g‘risida”gi Katta kodeksni yakunlab hayotga tatbiq etadi; maslahatchilar idorasini kengaytirib kengash rolini kuchaytiradi."]],
["Afrika","1076","Abu Bakr (Marokash sultoni)","Gana istilochisi",["Gana hukmdori “oltinlarning egasi” sifatida mashhur bo‘lib, savdodan boy edi.","1076-yili Ganaga yurish qilib uni bosib oladi, yillik o‘lpon va islomni qabul qildiradi. XI asr oxirida ozodlik harakati, keyin oltin tugashi va uzoq kurash natijasida Gana parchalanadi."]],
["Afrika","XIII asr","Sundiata Keyta","Mali asoschisi-hukmdori",["Kuchli qo‘shin tuzib, oltin konlari yerlarini va Gana hududini egallaydi; Atlantikadan Chad ko‘ligacha nazorat o‘rnatadi.","Bambukning oltinga boy hududlarini egallaydi – davlat moliyaviy farovonligi poydevori."]],
["Afrika","1312–1337","Mansa Muso","Mali hukmdori",["Mali qudratining cho‘qqisi: Afrikaning 24 ta o‘lka va viloyatlari ustidan nazorat.","Tombuktuda maktab, kutubxona va madrasa ochib, ta’limni va islomni yoyadi.","Vorislari taxt kurashi va tarqoqligi tufayli XV asrda Mali Songay tomonidan bosib olinadi."]],

var m=document.getElementById("m"),cg=document.getElementById("cg"),cr=document.getElementById("cr"),q=document.getElementById("q"),gr="Hammasi",rg="Hammasi",done={};
try{done=JSON.parse(localStorage.getItem("tarix8")||"{}")}catch(e){}
function save(){try{localStorage.setItem("tarix8",JSON.stringify(done))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var g="",tot=0,secs=[];
D.forEach(function(e,i){if(e.length==1&&typeof e[0]=="string")g=e[0].slice(1);else if(e.length>1){e.g=g;e.i=i;tot++;if(secs.indexOf(e[0])<0)secs.push(e[0])}});
function cnt(el,n){var t0=performance.now();(function f(t){var p=Math.min((t-t0)/1200,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
cnt(document.getElementById("s1"),tot);cnt(document.getElementById("s2"),secs.length);
function prog(){var n=Object.keys(done).length;document.getElementById("s3").textContent=n;document.getElementById("pb").style.width=(tot?n/tot*100:0)+"%"}
var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.08});
function chips(){var gs=["Hammasi"],rs=["Hammasi"];D.forEach(function(e){if(e.length>1){if(gs.indexOf(e.g)<0)gs.push(e.g);if((gr=="Hammasi"||e.g==gr)&&rs.indexOf(e[0])<0)rs.push(e[0])}});
function mk(a,k,c){return a.map(function(r){return'<button class="'+(r==c?"on":"")+'" data-k="'+k+'" data-r="'+esc(r)+'">'+(r=="Hammasi"?(k?"Barcha boʻlim":"Barcha sinf"):esc(r))+"</button>"}).join("")}
cg.innerHTML=mk(gs,0,gr);cr.innerHTML=mk(rs,1,rg)}
function draw(){var t=q.value.trim().toLowerCase(),h="",n=0,pend="";
D.forEach(function(e){if(e.length==1){if(typeof e[0]=="number")pend='<div class="pg">— '+e[0]+'-bet —</div>';return}
var txt=(e.slice(0,4).join(" ")+" "+e[4].join(" ")).toLowerCase();
if((gr=="Hammasi"||gr==e.g)&&(rg=="Hammasi"||rg==e[0])&&(!t||txt.indexOf(t)>-1)){n++;if(pend&&!t&&rg=="Hammasi"&&gr!="Hammasi")h+=pend;pend="";
h+='<article class="glass'+(done[e.i]?" done":"")+'" data-i="'+e.i+'"><div class="tg"><b>'+esc(e[0].toUpperCase())+'</b><span>'+esc(e[1])+'</span>'+(gr=="Hammasi"?'<span class="gg">· '+esc(e.g)+"</span>":"")+'<button class="ck" aria-label="Oʻzlashtirdim">✓</button></div><h2>'+esc(e[2])+"</h2><em>"+esc(e[3])+"</em><ol>"+e[4].map(function(p){return"<li>"+esc(p)+"</li>"}).join("")+"</ol></article>"}});
m.innerHTML=h;document.getElementById("none").style.display=n?"none":"block";
m.querySelectorAll("article").forEach(function(a){io.observe(a)});prog()}
function pick(ev){var b=ev.target.closest("button");if(!b)return;if(b.dataset.k=="0"){gr=b.dataset.r;rg="Hammasi"}else rg=b.dataset.r;chips();draw();window.scrollTo({top:document.querySelector(".bar").offsetTop-10,behavior:"smooth"})}
cg.onclick=pick;cr.onclick=pick;
m.onclick=function(ev){var b=ev.target.closest(".ck");if(!b)return;var a=b.closest("article"),i=a.dataset.i;if(done[i])delete done[i];else done[i]=1;a.classList.toggle("done");save();prog()};
q.oninput=draw;chips();draw();
document.getElementById("th").onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
var up=document.getElementById("up");addEventListener("scroll",function(){up.classList.toggle("s",scrollY>600)},{passive:true});
up.onclick=function(){scrollTo({top:0,behavior:"smooth"})};
</script></body></html>
